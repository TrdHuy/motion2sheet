name: temp-build-sword-shield-evidence

on:
  push:
    branches:
      - metadata/sword-and-shield-run-1-evidence

permissions:
  contents: write

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metadata/sword-and-shield-run-1-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check pillow matplotlib
      - name: Generate evidence from trusted source
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json, math
          import numpy as np
          import matplotlib.pyplot as plt

          root = Path('sample/humanoid_motion/mixamo/sword-and-shield-run-1')
          anim = json.loads((root / 'animation.json').read_text())
          gif = Image.open(root / 'preview.gif')
          frames = []
          for i in range(gif.n_frames):
              gif.seek(i)
              frames.append(gif.convert('RGB').copy())

          assert anim['frameCount'] == 17
          assert gif.n_frames == 17

          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          F_TITLE = ImageFont.truetype(bold_path, 32)
          F_LABEL = ImageFont.truetype(bold_path, 24)
          F_BODY = ImageFont.truetype(font_path, 19)
          F_SMALL = ImageFont.truetype(font_path, 17)

          def wrap_text(draw, text, font, max_width):
              words = text.split()
              lines, cur = [], ''
              for word in words:
                  test = word if not cur else cur + ' ' + word
                  if draw.textbbox((0, 0), test, font=font)[2] <= max_width:
                      cur = test
                  else:
                      if cur:
                          lines.append(cur)
                      cur = word
              if cur:
                  lines.append(cur)
              return lines

          def frame_grid(indices, roles, title, subtitle, cols=4, scale=2):
              fw, fh = frames[0].size
              iw, ih = fw * scale, fh * scale
              pad, label_h, header = 20, 92, 92
              rows = math.ceil(len(indices) / cols)
              width = pad + cols * (iw + pad)
              height = header + rows * (ih + label_h + pad)
              canvas = Image.new('RGB', (width, height), 'white')
              draw = ImageDraw.Draw(canvas)
              draw.text((pad, 12), title, font=F_TITLE, fill='black')
              draw.text((pad, 52), subtitle, font=F_SMALL, fill='black')
              for k, (idx, role) in enumerate(zip(indices, roles)):
                  row, col = divmod(k, cols)
                  x = pad + col * (iw + pad)
                  y = header + row * (ih + label_h + pad)
                  im = frames[idx].resize((iw, ih), Image.Resampling.NEAREST)
                  canvas.paste(im, (x, y))
                  draw.rectangle((x, y, x + iw - 1, y + ih - 1), outline='black', width=1)
                  draw.text((x, y + ih + 6), f'f{idx}', font=F_LABEL, fill='black')
                  yy = y + ih + 38
                  for line in wrap_text(draw, role, F_BODY, iw)[:2]:
                      draw.text((x, yy), line, font=F_BODY, fill='black')
                      yy += 24
              return canvas

          phase_idx = [0, 3, 4, 8, 9, 11, 12, 16]
          phase_roles = [
              'P1 start: pelvis low; knee recovery A',
              'P1 end: forward reach A; torso twist A',
              'P2 start: near first high point',
              'P2 end: descending to low / leg exchange',
              'P3 start: pelvis lowest; knee recovery B',
              'P3 end: forward reach B; opposite torso turn',
              'P4 start: second local rise / torso extreme B',
              'P4 end: returns to loop pose f0',
          ]
          frame_grid(
              phase_idx, phase_roles,
              'PHASE BOUNDARY EVIDENCE — sword-and-shield-run-1',
              'Exact frames from preview.gif; boundaries selected with animation.json motion data.',
              cols=4
          ).save(root / 'phases.png')

          key_idx = [1, 3, 9, 11]
          key_roles = [
              'knee-recovery peak A',
              'forward-reach / torso-twist extreme A',
              'knee-recovery peak B; pelvis lowest',
              'opposite forward-reach; shoulder-turn extreme B',
          ]
          frame_grid(
              key_idx, key_roles,
              'KEY POSE EVIDENCE — sword-and-shield-run-1',
              'Only motion-defining poses selected from the 17-frame loop.',
              cols=4
          ).save(root / 'key-poses.png')

          hips = np.asarray(anim['hips']['translations'], dtype=float)
          x = np.arange(anim['frameCount'])
          plt.figure(figsize=(11, 3.6))
          plt.plot(x, hips[:, 0], marker='o', label='hips X (+X right)')
          plt.plot(x, hips[:, 2], marker='o', label='hips Z (+Z up)')
          for i in [0, 5, 8, 9, 12, 16]:
              plt.axvline(i, linestyle='--', alpha=.25)
          plt.xticks(x)
          plt.xlabel('frame')
          plt.ylabel('translation (mean-leg-length)')
          plt.title('Pelvis translation from animation.json')
          plt.legend()
          plt.tight_layout()
          wt_plot = Path('/tmp/weight-plot.png')
          plt.savefig(wt_plot, dpi=160)
          plt.close()

          wt_idx = [0, 5, 8, 9, 12, 16]
          wt_roles = [f'hips X={hips[i,0]:+.4f}; Z={hips[i,2]:+.4f}' for i in wt_idx]
          wt_grid = frame_grid(
              wt_idx, wt_roles,
              'WEIGHT-TRANSFER EVIDENCE — pelvis proxy',
              'Exact source frames above; numeric pelvis path below. No supporting foot is assigned.',
              cols=3
          )
          plot = Image.open(wt_plot).convert('RGB')
          width = max(wt_grid.width, plot.width)
          canvas = Image.new('RGB', (width, wt_grid.height + plot.height + 18), 'white')
          canvas.paste(wt_grid, (0, 0))
          canvas.paste(plot, ((width - plot.width) // 2, wt_grid.height + 18))
          canvas.save(root / 'weight-transfer.png')

          def local_z(q):
              w, xq, yq, zq = q
              return math.degrees(math.atan2(2 * (w * zq + xq * yq), 1 - 2 * (yq * yq + zq * zq)))

          hips_z = np.asarray([local_z(q) for q in anim['hips']['rotations']])
          chest_z = np.asarray([local_z(q) for q in anim['joints']['Chest']['rotations']])
          left_shoulder_z = np.asarray([local_z(q) for q in anim['joints']['LeftShoulder']['rotations']])
          right_shoulder_z = np.asarray([local_z(q) for q in anim['joints']['RightShoulder']['rotations']])

          plt.figure(figsize=(11, 4.0))
          plt.plot(x, hips_z, marker='o', label='Hips local Z')
          plt.plot(x, chest_z, marker='o', label='Chest local Z')
          plt.plot(x, left_shoulder_z, marker='o', label='LeftShoulder local Z')
          plt.plot(x, right_shoulder_z, marker='o', label='RightShoulder local Z')
          for i in [3, 11, 12]:
              plt.axvline(i, linestyle='--', alpha=.25)
          plt.xticks(x)
          plt.xlabel('frame')
          plt.ylabel('rotation around local +Z (degrees)')
          plt.title('Upper-body coordination derived from wxyz quaternions')
          plt.legend(ncol=2)
          plt.tight_layout()
          body_plot = Path('/tmp/body-plot.png')
          plt.savefig(body_plot, dpi=160)
          plt.close()

          body_idx = [0, 3, 9, 11, 12, 16]
          body_roles = [f'Hips Z={hips_z[i]:+.1f}°; Chest Z={chest_z[i]:+.1f}°' for i in body_idx]
          body_grid = frame_grid(
              body_idx, body_roles,
              'BODY-MECHANICS EVIDENCE — torso / shoulder coordination',
              'Frames from preview.gif; local +Z rotation plot from animation.json (wxyz → XYZ Euler).',
              cols=3
          )
          plot = Image.open(body_plot).convert('RGB')
          width = max(body_grid.width, plot.width)
          canvas = Image.new('RGB', (width, body_grid.height + plot.height + 18), 'white')
          canvas.paste(body_grid, (0, 0))
          canvas.paste(plot, ((width - plot.width) // 2, body_grid.height + 18))
          canvas.save(root / 'body-mechanics.png')
          PY
      - name: Commit evidence and remove temporary workflow
        run: |
          git config user.name 'synclab-automation-system'
          git config user.email '207300498+synclab-automation-system@users.noreply.github.com'
          git rm .github/workflows/temp-build-sword-shield-evidence.yml
          git add sample/humanoid_motion/mixamo/sword-and-shield-run-1/phases.png \
                  sample/humanoid_motion/mixamo/sword-and-shield-run-1/key-poses.png \
                  sample/humanoid_motion/mixamo/sword-and-shield-run-1/weight-transfer.png \
                  sample/humanoid_motion/mixamo/sword-and-shield-run-1/body-mechanics.png
          git commit -m 'docs: add evidence for sword-and-shield-run-1 metadata review'
          git push origin HEAD:metadata/sword-and-shield-run-1-evidence
