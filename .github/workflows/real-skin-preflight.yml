name: Real Mixamo JSON-only Preflight

on:
  pull_request:
    paths:
      - 'motion2sheet/motion/model_render/**'
      - 'motion2sheet/motion/skin/**'
      - 'motion2sheet/motion/cli.py'
      - 'profiles/cameras/**'
      - 'tests/motion/model_render/**'
      - '.github/workflows/real-skin-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: real-mixamo-preflight / json-only-playback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASSET_URL: https://github.com/TrdHuy/motion2sheet/releases/download/e2e_gh_action_asset/walking_mixamo_with_skin.fbx
      ASSET_SHA256: 1e05bcef7c030dce1be09a38a6e3d2f38d1f9bc71396584876ab1a3141005c02
      ROOT: build/real_skin_preflight
      CAMERA: profiles/cameras/front_final.json5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Skin + real-model unit tests
        run: pytest tests/motion/skin tests/motion/model_render
      - name: Install Blender headless runtime libraries
        run: |
          set -euo pipefail
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with: {version: '4.5.12'}
      - name: Download exact Mixamo With-Skin release asset
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          ASSET="$RUNNER_TEMP/walking_mixamo_with_skin.fbx"
          curl -fL --retry 3 --retry-delay 2 -o "$ASSET" "$ASSET_URL"
          echo "$ASSET_SHA256  $ASSET" | sha256sum -c -
          test "$(stat -c %s "$ASSET")" -eq 41940608
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
      - name: Extract real Model + Rig + Skin authority
        run: |
          set -euo pipefail
          motion2sheet export-character "$ASSET" --output "$ROOT/character"
          test -s "$ROOT/character/model.glb"
          test -s "$ROOT/character/rig.json"
          test -s "$ROOT/character/skin.json"
      - name: Normalize only numerical rest shear for locked PR 11 motion exporter
        run: |
          set -euo pipefail
          NORMALIZED="$RUNNER_TEMP/walking_mixamo_motion_normalized.fbx"
          blender --background --factory-startup --python-exit-code 1 \
            --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- \
            --input "$ASSET" \
            --output "$NORMALIZED" \
            --report "$ROOT/motion_source_normalization.json"
          test -s "$NORMALIZED"
          echo "NORMALIZED=$NORMALIZED" >> "$GITHUB_ENV"
      - name: Export Contract B animation using locked PR 11 command
        run: |
          set -euo pipefail
          motion2sheet export-animation-json "$NORMALIZED" --output "$ROOT/animation"
          test -s "$ROOT/animation/rig.json"
          test -s "$ROOT/animation/animation.json"
      - name: Render one actual-source silhouette before deletion
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from motion2sheet.motion.model_render.profile import load_camera_profile
          from motion2sheet.motion.roundtrip.schema import read_json
          root=Path(os.environ['ROOT'])
          animation=read_json(root/'animation'/'animation.json')
          normalization=json.loads((root/'motion_source_normalization.json').read_text())
          first=int(animation['frames'][0]['frame'])
          output=root/'source-reference'
          output.mkdir(parents=True,exist_ok=True)
          request={
              'sourcePath': os.environ['ASSET'],
              'output': str(output.resolve()),
              'selectedFrames': [first],
              'frameOffset': int(normalization['frameOffset']),
              'canvas': [320,320],
              'background': {'transparent': True, 'rgba': [0.0,0.0,0.0,0.0]},
              'camera': load_camera_profile(Path(os.environ['CAMERA'])),
          }
          (output/'request.json').write_text(json.dumps(request,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          blender --background --factory-startup --python-exit-code 1 \
            --python motion2sheet/motion/model_render/blender_source_reference.py -- \
            --request "$ROOT/source-reference/request.json"
          test -s "$ROOT/source-reference/.frames/frame_0002.png"
          test -s "$ROOT/source-reference/source_reference.json"
      - name: Delete every FBX before JSON-only playback preflight
        run: |
          set -euo pipefail
          rm -f "$ASSET" "$NORMALIZED"
          test ! -e "$ASSET"
          test ! -e "$NORMALIZED"
      - name: Strict JSON-only Skin + Contract B playback preflight
        run: |
          set -euo pipefail
          motion2sheet render-model-animation \
            --model "$ROOT/character/model.glb" \
            --character-rig "$ROOT/character/rig.json" \
            --skin "$ROOT/character/skin.json" \
            --animation-rig "$ROOT/animation/rig.json" \
            --animation "$ROOT/animation/animation.json" \
            --camera-profile "$CAMERA" \
            --frames 2 \
            --sheet-columns 1 \
            --canvas 320x320 \
            --background transparent \
            --output "$ROOT/render"
          test ! -e "$ASSET"
          test ! -e "$NORMALIZED"
      - name: Verify strict Skin, playback and silhouette metrics
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ['ROOT'])
          report=json.loads((root/'render'/'render.json').read_text())
          export=json.loads((root/'character'/'diagnostics'/'export.json').read_text())
          skin=report['skinReconstruction']
          playback=report['animationFidelity']
          assert export['modelAuthority']['geometryPose']=='canonical-character-rest'
          assert export['geometryRestBake']['topologyPreserved']
          assert skin['pass'] and skin['maxWeightDelta'] <= 1e-8, skin
          assert playback['pass'], playback
          assert playback['leftRightIdentityPass'] and playback['fullBonePlayback']
          assert playback['maxSemanticDirectionErrorDegrees'] <= 0.001
          assert playback['maxJointBendErrorDegrees'] <= 0.001
          assert playback['maxLocalRotationErrorDegrees'] <= 0.0001
          assert playback['rootMotion']['directionPreserved']
          source=Image.open(root/'source-reference'/'.frames'/'frame_0002.png').convert('RGBA')
          target=Image.open(root/'render'/'pose_sheet.png').convert('RGBA')
          assert source.size==target.size==(320,320)
          source_alpha=source.getchannel('A')
          target_alpha=target.getchannel('A')
          source_mask=bytes(1 if value else 0 for value in source_alpha.getdata())
          target_mask=bytes(1 if value else 0 for value in target_alpha.getdata())
          mismatch=sum(a!=b for a,b in zip(source_mask,target_mask))
          foreground=sum(source_mask)
          union=sum(1 for a,b in zip(source_mask,target_mask) if a or b)
          intersection=sum(1 for a,b in zip(source_mask,target_mask) if a and b)
          iou=intersection/union if union else 1.0
          assert mismatch==0, {'silhouetteMismatchPixels':mismatch,'silhouetteIoU':iou}
          visual=Image.new('RGBA',(640,356),(255,255,255,255))
          visual.alpha_composite(source,(0,36)); visual.alpha_composite(target,(320,36))
          visual.save(root/'visual-comparison.png')
          source.close(); target.close(); visual.close()
          metrics={
              'maxWeightDelta': skin['maxWeightDelta'],
              'maxSemanticDirectionErrorDegrees': playback['maxSemanticDirectionErrorDegrees'],
              'maxJointBendErrorDegrees': playback['maxJointBendErrorDegrees'],
              'maxLocalRotationErrorDegrees': playback['maxLocalRotationErrorDegrees'],
              'rootDirectionErrorDegrees': playback['rootMotion']['directionErrorDegrees'],
              'silhouetteForegroundPixels': foreground,
              'silhouetteMismatchPixels': mismatch,
              'silhouetteIoU': iou,
          }
          (root/'preflight-summary.json').write_text(json.dumps(metrics,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(metrics,indent=2,sort_keys=True))
          PY
      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mixamo-json-only-preflight
          path: build/real_skin_preflight/
          if-no-files-found: warn
          retention-days: 7
