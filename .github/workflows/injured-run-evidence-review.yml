name: Injured Run Evidence Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/injured-run-evidence-review.yml'
      - 'sample/humanoid_motion/mixamo/injured-run/**'

permissions:
  contents: write

jobs:
  generate-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install evidence tooling
        run: python -m pip install pillow

      - name: Generate evidence from trusted source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('sample/humanoid_motion/mixamo/injured-run')
          animation = json.loads((root / 'animation.json').read_text())
          assert animation['frameCount'] == 20
          assert animation['fps'] == 30.0
          assert animation['loop'] is True
          assert animation['coordinateSystem']['rightAxis'] == '+X'
          assert animation['coordinateSystem']['upAxis'] == '+Z'
          assert animation['quaternionConvention']['componentOrder'] == 'wxyz'

          gif = Image.open(root / 'preview.gif')
          frames = []
          for frame_id in range(animation['frameCount']):
              gif.seek(frame_id)
              frames.append(gif.convert('RGB').copy())

          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          title_font = ImageFont.truetype(bold, 34)
          subtitle_font = ImageFont.truetype(regular, 18)
          frame_font = ImageFont.truetype(bold, 24)
          label_font = ImageFont.truetype(regular, 16)
          label_bold = ImageFont.truetype(bold, 16)
          small_font = ImageFont.truetype(regular, 14)

          crop_box = (45, 42, 180, 220)
          def panel(frame_id, width, height):
              crop = frames[frame_id].crop(crop_box)
              scale = min(width / crop.width, height / crop.height)
              size = (max(1, int(crop.width * scale)), max(1, int(crop.height * scale)))
              resized = crop.resize(size, Image.Resampling.NEAREST)
              out = Image.new('RGB', (width, height), 'black')
              out.paste(resized, ((width-size[0])//2, (height-size[1])//2))
              return out

          # phases.png — exact phase start/end frames only.
          phase_items = [
              (0,  'START', 'f0–f4: nâng / chuẩn bị'),
              (4,  'END',   'f0–f4: nâng / chuẩn bị'),
              (5,  'START', 'f5–f9: dịch ngang / mở bước'),
              (9,  'END',   'f5–f9: dịch ngang / mở bước'),
              (10, 'START', 'f10–f14: đổi tải / hạ dần'),
              (14, 'END',   'f10–f14: đổi tải / hạ dần'),
              (15, 'START', 'f15–f19: hồi phục / đóng vòng'),
              (19, 'END',   'f15–f19: hồi phục / đóng vòng'),
          ]
          W, margin, gap, header = 1760, 20, 16, 100
          cell_w = (W - 2*margin - 3*gap)//4
          panel_h, label_h = 390, 58
          row_h = 34 + panel_h + label_h
          H = header + 2*row_h + gap + 16
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Phase boundaries — injured-run', font=title_font, fill='black')
          draw.text((20,56), 'Chỉ hiển thị đúng frame bắt đầu/kết thúc dùng để xác định ranh giới phase.', font=subtitle_font, fill='black')
          for idx,(frame_id,kind,desc) in enumerate(phase_items):
              row,col = divmod(idx,4)
              x = margin + col*(cell_w+gap)
              y = header + row*(row_h+gap)
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              ly = y+34+panel_h+5
              draw.text((x+4,ly), f'{kind}: {desc}', font=label_font, fill='black')
          canvas.save(root / 'phases.png', optimize=True)

          # key-poses.png — only distinct poses used by review text.
          key_items = [
              (0,  'bắt đầu vòng lặp / thế thấp có phòng thủ'),
              (5,  'đỉnh nâng pelvis / đỉnh chuẩn bị'),
              (10, 'dịch pelvis +X mạnh nhất / bước mở'),
              (15, 'pelvis thấp nhất / nén recoil'),
              (19, 'đóng vòng lặp / trở gần pose đầu'),
          ]
          W, margin, gap, header = 1750, 20, 18, 100
          cell_w = (W - 2*margin - 4*gap)//5
          panel_h = 455
          H = header + 34 + panel_h + 74
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Key poses — injured-run', font=title_font, fill='black')
          draw.text((20,56), 'Các pose đại diện cho thay đổi hình dáng và nhịp chuyển động chính.', font=subtitle_font, fill='black')
          for idx,(frame_id,role) in enumerate(key_items):
              x = margin + idx*(cell_w+gap)
              y = header
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              draw.text((x+4,y+34+panel_h+8), role, font=label_bold, fill='black')
          canvas.save(root / 'key-poses.png', optimize=True)

          # weight-transfer.png — rendered frames + direct hips X/Z data.
          selected = [0,5,10,15,19]
          hips = animation['hips']['translations']
          W, margin, gap, header = 1750, 20, 18, 125
          cell_w = (W - 2*margin - 4*gap)//5
          panel_h = 425
          graph_h = 245
          H = header + 34 + panel_h + 72 + graph_h + 50
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Weight transfer — injured-run', font=title_font, fill='black')
          draw.text((20,56), 'Pelvis: rise → +X lateral shift → drop → return. Không khẳng định chân trụ hoặc bên bị thương.', font=subtitle_font, fill='black')
          draw.text((20,82), 'Hips translation lấy trực tiếp từ animation.json; +X = bên phải nhân vật, +Z = lên.', font=small_font, fill='black')
          for idx,frame_id in enumerate(selected):
              x = margin + idx*(cell_w+gap)
              y = header
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              hx,hy,hz = [float(v) for v in hips[frame_id]]
              draw.text((x+4,y+34+panel_h+7), f'Hips X={hx:+.4f}', font=label_bold, fill='black')
              draw.text((x+4,y+34+panel_h+29), f'Hips Z={hz:+.4f}', font=label_bold, fill='black')

          # Simple numeric trajectory plot for X and Z, normalized independently.
          gx0, gy0 = 90, header + 34 + panel_h + 84
          gx1, gy1 = W-70, H-55
          draw.rectangle((gx0,gy0,gx1,gy1), outline='black', width=2)
          xs = [float(v[0]) for v in hips]
          zs = [float(v[2]) for v in hips]
          def ymap(v, vals, top, bottom):
              lo,hi=min(vals),max(vals)
              if hi == lo: return (top+bottom)//2
              return int(bottom - (v-lo)/(hi-lo)*(bottom-top))
          def xmap(i): return int(gx0 + i/(len(xs)-1)*(gx1-gx0))
          # X series
          ptsx=[(xmap(i), ymap(v,xs,gy0+18,gy1-18)) for i,v in enumerate(xs)]
          ptsz=[(xmap(i), ymap(v,zs,gy0+18,gy1-18)) for i,v in enumerate(zs)]
          draw.line(ptsx, fill='black', width=3)
          draw.line(ptsz, fill='gray', width=3)
          draw.text((gx0+8,gy0+6),'Hips X (đen) · Hips Z (xám) — mỗi kênh chuẩn hóa riêng để thấy nhịp',font=small_font,fill='black')
          for f in selected:
              px=xmap(f)
              draw.line((px,gy0,px,gy1), fill='lightgray', width=1)
              draw.text((px+3,gy1-20),f'f{f}',font=small_font,fill='black')
          canvas.save(root / 'weight-transfer.png', optimize=True)

          # body-mechanics.png — visual coordination + quaternion-derived yaw deltas.
          def yaw_deg(q):
              w,x,y,z = [float(v) for v in q]
              return math.degrees(math.atan2(2*(w*z+x*y), 1-2*(y*y+z*z)))
          chest = animation['joints']['Chest']['rotations']
          shoulder_l = animation['joints']['LeftShoulder']['rotations']
          selected = [0,5,10,15,19]
          chest_yaw = [yaw_deg(q) for q in chest]
          shoulder_yaw = [yaw_deg(q) for q in shoulder_l]
          c0, s0 = chest_yaw[0], shoulder_yaw[0]
          W, margin, gap, header = 1750, 20, 18, 125
          cell_w = (W - 2*margin - 4*gap)//5
          panel_h = 440
          H = header + 34 + panel_h + 100
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Body mechanics — injured-run', font=title_font, fill='black')
          draw.text((20,56), 'Pelvis dẫn nhịp rise/shift/drop/return; chest/shoulder và tay thay đổi đối trọng theo chu kỳ.', font=subtitle_font, fill='black')
          draw.text((20,82), 'Δyaw dưới mỗi frame được suy ra từ quaternion wxyz trong animation.json, tương đối với f0.', font=small_font, fill='black')
          roles = {
              0:'thế guarded thấp',
              5:'pelvis nâng; thân mở',
              10:'dịch ngang; tay đối trọng',
              15:'nén thấp; thân/tay bù trừ',
              19:'hồi về cấu hình đầu vòng',
          }
          for idx,frame_id in enumerate(selected):
              x = margin + idx*(cell_w+gap)
              y = header
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              draw.text((x+4,y+34+panel_h+7), roles[frame_id], font=label_bold, fill='black')
              draw.text((x+4,y+34+panel_h+31), f'Chest Δyaw={chest_yaw[frame_id]-c0:+.1f}°', font=small_font, fill='black')
              draw.text((x+4,y+34+panel_h+51), f'LShoulder Δyaw={shoulder_yaw[frame_id]-s0:+.1f}°', font=small_font, fill='black')
          canvas.save(root / 'body-mechanics.png', optimize=True)
          PY

      - name: Verify trusted source is untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- sample/humanoid_motion/mixamo/injured-run/animation.json
          git diff --exit-code -- sample/humanoid_motion/mixamo/injured-run/preview.gif
          test ! -e sample/humanoid_motion/mixamo/injured-run/metadata.json

      - name: Commit evidence on PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sample/humanoid_motion/mixamo/injured-run/phases.png \
            sample/humanoid_motion/mixamo/injured-run/key-poses.png \
            sample/humanoid_motion/mixamo/injured-run/weight-transfer.png \
            sample/humanoid_motion/mixamo/injured-run/body-mechanics.png
          git commit -m 'docs: add injured-run metadata evidence'
          git push origin HEAD:"$HEAD_BRANCH"
