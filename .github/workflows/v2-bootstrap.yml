name: Apply Anim2Sheet Profile Contract v2 payload

on:
  push:
    branches:
      - refactor/anim2sheet-profile-contract-v2
    paths:
      - '.v2-bootstrap/**'
      - '.github/workflows/v2-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply prepared migration
        run: |
          set -euo pipefail
          cat .v2-bootstrap/payload.* | base64 -d > /tmp/v2payload.tar.gz
          tar -xzf /tmp/v2payload.tar.gz -C .
          # GitHub Actions tokens cannot update workflow files. Keep the
          # current debug workflow unchanged here; it is updated separately
          # through the GitHub connector after the source migration lands.
          git checkout HEAD -- .github/workflows/anim2sheet-debug.yml
          rm -f \
            profiles/anim2sheet/animations/gale_slash/pose_reference.json \
            profiles/anim2sheet/animations/gale_slash/joint_contract.json \
            profiles/anim2sheet/animations/sword_idle/pose_reference.json \
            profiles/anim2sheet/animations/sword_idle/joint_contract.json
          rm -rf .v2-bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Complete Anim2Sheet Profile Contract v2 migration"
          git push origin HEAD:refactor/anim2sheet-profile-contract-v2
