name: temp-sword-shield-evidence-sheet

on:
  push:
    branches:
      - metadata/sword-and-shield-run-1-evidence

permissions:
  contents: read

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build exact-frame contact sheet
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          src = Path('sample/humanoid_motion/mixamo/sword-and-shield-run-1/preview.gif')
          im = Image.open(src)
          frames = []
          for i in range(im.n_frames):
              im.seek(i)
              frames.append(im.convert('RGB').copy())

          cols = 5
          cell_w, cell_h = frames[0].size
          label_h = 28
          rows = (len(frames) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * cell_w, rows * (cell_h + label_h)), 'white')
          draw = ImageDraw.Draw(sheet)
          for i, frame in enumerate(frames):
              x = (i % cols) * cell_w
              y = (i // cols) * (cell_h + label_h)
              sheet.paste(frame, (x, y))
              draw.text((x + 8, y + cell_h + 5), f'f{i}', fill='black')
          out = Path('/tmp/all-frames.png')
          sheet.save(out)
          print(f'gif_frames={len(frames)} size={frames[0].size} output={out}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sword-shield-run-1-all-frames
          path: /tmp/all-frames.png
          if-no-files-found: error
