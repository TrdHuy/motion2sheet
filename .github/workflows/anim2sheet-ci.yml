name: Anim2sheet Migration Review

on:
  pull_request:
    paths:
      - 'motion2sheet/anim2sheet/**'
      - 'profiles/anim2sheet/**'
      - 'tests/anim2sheet/**'
      - '.github/workflows/anim2sheet-ci.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anim2sheet-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest tests/anim2sheet/unit
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb libx11-6 libxext6 libxrender1 libxi6 libxkbcommon0 libgl1-mesa-dri
      - name: Setup Blender 4.5.12
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version
      - name: Review canonical Gale Slash F1-F16 through public CLI
        run: >-
          anim2sheet review
          --animation gale_slash
          --profile profiles/anim2sheet/animations/gale_slash/animation.json5
          --joint-contract profiles/anim2sheet/animations/gale_slash/joint_contract.json
          --camera-profile profiles/anim2sheet/cameras/fast_keypose_review.json
          --output build/anim/canonical_review
      - name: Validate public artifact
        run: anim2sheet validate build/anim/canonical_review
      - name: Verify saved-blend and proxy authority
        run: python tests/anim2sheet/e2e/verify_keypose_authority.py build/anim/canonical_review
      - name: Verify key-pose architecture semantics
        run: python tests/anim2sheet/e2e/verify_keypose_architecture.py build/anim/canonical_review
      - name: Upload canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion2sheet-anim2sheet-migration-review
          path: build/anim/canonical_review/
          if-no-files-found: warn
          retention-days: 7
