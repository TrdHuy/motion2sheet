name: Anim2Sheet POC CI

on:
  pull_request:
    paths:
      - 'motion2sheet/anim2sheet/**'
      - 'profiles/anim2sheet/**'
      - 'tests/anim2sheet/**'
      - '.github/workflows/anim2sheet-ci.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anim2sheet-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest tests/anim2sheet/unit
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Setup Blender 4.5.12
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version
      - name: Build Gale Slash run A
        run: anim2sheet build --profile profiles/anim2sheet/swordsman/gale_slash.json5 --output build/anim/run_a
      - name: Build Gale Slash run B
        run: anim2sheet build --profile profiles/anim2sheet/swordsman/gale_slash.json5 --output build/anim/run_b
      - name: Validate outputs
        run: |
          anim2sheet validate build/anim/run_a
          anim2sheet validate build/anim/run_b
      - name: Verify motion semantics
        run: python tests/anim2sheet/e2e/verify_motion_semantics.py build/anim/run_a
      - name: Verify A/B decoded pixel determinism
        run: python tests/anim2sheet/e2e/verify_pixels.py build/anim/run_a/frames build/anim/run_b/frames
      - name: Re-render saved Blender source
        run: blender --background build/anim/run_a/source.blend --python tests/anim2sheet/e2e/render_saved_anim_blend.py -- --output build/anim/reopened_frames
      - name: Verify source.blend authority
        run: python tests/anim2sheet/e2e/verify_pixels.py build/anim/run_a/frames build/anim/reopened_frames
      - name: Upload generated animation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion2sheet-anim2sheet-gale-slash-poc
          path: build/anim/
          if-no-files-found: warn
          retention-days: 7
