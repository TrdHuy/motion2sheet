name: Fast Keypose Review

on:
  pull_request:
    paths:
      - 'motion2sheet/anim2sheet/**'
      - 'profiles/anim2sheet/**'
      - 'tests/anim2sheet/**'
      - '.github/workflows/anim2sheet-ci.yml'
      - '.github/workflows/anim2sheet-full-review.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-keypose-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest tests/anim2sheet/unit
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb libx11-6 libxext6 libxrender1 libxi6 libxkbcommon0 libgl1-mesa-dri
      - name: Setup Blender 4.5.12
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version
      - name: Build F1 F6 F7 F8 deterministic arm review
        run: >-
          python -m motion2sheet.anim2sheet.keypose_review
          --profile profiles/anim2sheet/swordsman/gale_slash.json5
          --joint-contract profiles/anim2sheet/swordsman/gale_slash_arm_joint_keyposes.json
          --output build/anim/keypose_review
      - name: Verify key-pose architecture semantics
        run: python tests/anim2sheet/e2e/verify_keypose_architecture.py build/anim/keypose_review
      - name: Upload fast key-pose artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion2sheet-fast-keypose-review
          path: build/anim/keypose_review/
          if-no-files-found: warn
          retention-days: 7
