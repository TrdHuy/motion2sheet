name: Catwalk source bridge

on:
  push:
    branches:
      - codex/catwalk-walk-metadata-evidence
    paths:
      - .github/workflows/catwalk-source-bridge.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Stage trusted source snapshot
        run: |
          mkdir -p source-snapshot
          cp sample/humanoid_motion/mixamo/catwalk-walk/animation.json source-snapshot/animation.json
          cp sample/humanoid_motion/mixamo/catwalk-walk/preview.gif source-snapshot/preview.gif
          sha1sum source-snapshot/animation.json source-snapshot/preview.gif > source-snapshot/sha1.txt
          git rev-parse HEAD > source-snapshot/commit.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: catwalk-source-snapshot
          path: source-snapshot/
          retention-days: 1
