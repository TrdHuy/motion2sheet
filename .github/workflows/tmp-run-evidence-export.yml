name: Temporary run evidence export

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-run-evidence-export.yml'
      - 'sample/humanoid_motion/mixamo/run/**'

permissions:
  contents: read

jobs:
  export-run-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: run-source-for-evidence
          path: |
            sample/humanoid_motion/mixamo/run/animation.json
            sample/humanoid_motion/mixamo/run/preview.gif
          if-no-files-found: error
          retention-days: 1
