name: Walking 2 evidence revision

on:
  push:
    branches:
      - review/walking-2-metadata-evidence
    paths:
      - .github/workflows/walking-2-evidence-revise.yml

permissions:
  contents: write

jobs:
  build-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/walking-2-metadata-evidence

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate revised evidence from trusted source
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import json, math

          src = Path('sample/humanoid_motion/mixamo/walking-2')
          data = json.loads((src / 'animation.json').read_text())
          gif = Image.open(src / 'preview.gif')
          frames = []
          for i in range(gif.n_frames):
              gif.seek(i)
              frames.append(gif.convert('RGB').copy())

          assert data['frameCount'] == 50
          assert len(frames) == 50
          assert data['loop'] is True

          def load_font(size, bold=False):
              paths = [
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                  '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf',
              ]
              for path in paths:
                  p = Path(path)
                  if p.exists():
                      return ImageFont.truetype(str(p), size)
              return ImageFont.load_default()

          F_TITLE = load_font(28, True)
          F_LABEL = load_font(20, True)
          F_SMALL = load_font(16)
          F_TINY = load_font(14)

          def wrap(draw, text, max_width, font):
              words = text.split()
              lines, current = [], ''
              for word in words:
                  candidate = (current + ' ' + word).strip()
                  if draw.textbbox((0, 0), candidate, font=font)[2] <= max_width:
                      current = candidate
                  else:
                      if current:
                          lines.append(current)
                      current = word
              if current:
                  lines.append(current)
              return lines

          def montage(path, title, items, cols=4, footer=None):
              fw, fh, cap, gap, pad, title_h = 300, 300, 78, 12, 20, 58
              rows = math.ceil(len(items) / cols)
              footer_h = 58 if footer else 0
              width = pad * 2 + cols * fw + (cols - 1) * gap
              height = title_h + pad + rows * (fh + cap) + (rows - 1) * gap + pad + footer_h
              out = Image.new('RGB', (width, height), 'white')
              draw = ImageDraw.Draw(out)
              draw.text((pad, 12), title, fill='black', font=F_TITLE)
              y0 = title_h + pad
              for k, (idx, role) in enumerate(items):
                  row, col = divmod(k, cols)
                  x = pad + col * (fw + gap)
                  y = y0 + row * (fh + cap + gap)
                  out.paste(frames[idx].resize((fw, fh)), (x, y))
                  draw.rectangle((x, y, x + fw - 1, y + fh - 1), outline='black', width=1)
                  draw.text((x + 6, y + fh + 5), f'f{idx}', fill='black', font=F_LABEL)
                  for li, line in enumerate(wrap(draw, role, fw - 58, F_TINY)[:3]):
                      draw.text((x + 56, y + fh + 7 + li * 18), line, fill='black', font=F_TINY)
              if footer:
                  draw.line((pad, height - footer_h, width - pad, height - footer_h), fill='black', width=1)
                  for li, line in enumerate(wrap(draw, footer, width - 2 * pad, F_SMALL)[:2]):
                      draw.text((pad, height - footer_h + 10 + li * 20), line, fill='black', font=F_SMALL)
              out.save(path, optimize=True)

          # Quaternion orientation distance from the same joint at f0.
          def qnorm(q):
              n = math.sqrt(sum(v * v for v in q))
              return [v / n for v in q]

          def qangle(a, b):
              a, b = qnorm(a), qnorm(b)
              dot = abs(sum(x * y for x, y in zip(a, b)))
              dot = max(-1.0, min(1.0, dot))
              return math.degrees(2.0 * math.acos(dot))

          tracks = {}
          for joint in ('LeftUpperLeg', 'LeftLowerLeg', 'LeftFoot', 'RightUpperLeg'):
              rotations = data['joints'][joint]['rotations']
              tracks[joint] = [qangle(rotations[0], q) for q in rotations]

          # Phase evidence: exactly the boundary frames.
          montage(
              src / 'phases.png',
              'walking-2 — evidence ranh giới phase (review lại chân trái)',
              [
                  (0,  'P1 bắt đầu · pose loop · chân trái mở ra'),
                  (12, 'P1 kết thúc · LeftUpperLeg lệch f0 lớn nhất'),
                  (13, 'P2 bắt đầu · LeftFoot lệch f0 lớn nhất'),
                  (27, 'P2 kết thúc · torso ở vùng xoay cực đại'),
                  (28, 'P3 bắt đầu · đùi trái gần về pose đầu, cẳng chân còn swing'),
                  (40, 'P3 kết thúc · RightUpperLeg lệch f0 lớn nhất'),
                  (41, 'P4 bắt đầu · chân phải bắt đầu hồi mạnh'),
                  (49, 'P4 kết thúc · chân trái gần khớp lại pose f0'),
              ],
              cols=4,
              footer='Ranh giới giữ theo review trước; nhãn mới bổ sung trạng thái chân trái từ LeftUpperLeg / LeftLowerLeg / LeftFoot trong animation.json.'
          )

          montage(
              src / 'key-poses.png',
              'walking-2 — key poses có evidence cho chân trái',
              [
                  (0,  'mốc loop; chân trái mở ra'),
                  (9,  'pelvis thấp nhất'),
                  (13, 'chân trái: bàn chân đạt lệch orientation lớn nhất so với f0'),
                  (27, 'vùng đỉnh xoay thân'),
                  (30, 'chân trái: cẳng chân đạt lệch orientation lớn nhất so với f0'),
                  (40, 'chân phải: đùi đạt lệch orientation lớn nhất so với f0'),
              ],
              cols=3,
              footer='Không gán contact/chân trụ. “Lệch orientation” là khoảng cách góc quaternion tới cùng joint tại f0, không phải góc gập khớp tuyệt đối.'
          )

          # Weight transfer remains pelvis-based; explicitly avoid inferring support leg.
          hips = data['hips']['translations']
          items = [(0, 'bắt đầu +X'), (9, 'pelvis thấp nhất'), (21, 'pelvis X nhỏ nhất'), (41, 'đảo chiều hồi loop'), (49, 'trở về +X')]
          fw, fh, cap, gap, pad, title_h, chart_h = 280, 280, 74, 10, 20, 58, 230
          width = pad * 2 + 5 * fw + 4 * gap
          height = title_h + pad + fh + cap + pad + chart_h + 65
          out = Image.new('RGB', (width, height), 'white')
          draw = ImageDraw.Draw(out)
          draw.text((pad, 12), 'walking-2 — evidence weightTransfer', fill='black', font=F_TITLE)
          y = title_h + pad
          for k, (idx, role) in enumerate(items):
              x = pad + k * (fw + gap)
              out.paste(frames[idx].resize((fw, fh)), (x, y))
              draw.rectangle((x, y, x + fw - 1, y + fh - 1), outline='black', width=1)
              hx, _, hz = hips[idx]
              draw.text((x + 5, y + fh + 5), f'f{idx} · {role}', fill='black', font=F_TINY)
              draw.text((x + 5, y + fh + 28), f'Hips X={hx:+.3f}   Z={hz:+.3f}', fill='black', font=F_TINY)

          chart_x0 = pad + 55
          chart_y0 = title_h + pad + fh + cap + 35
          chart_w = width - 2 * pad - 100
          chart_inner_h = chart_h - 60
          values = [p[0] for p in hips]
          vmin, vmax = min(values), max(values)
          def px(i): return chart_x0 + chart_w * i / (len(values) - 1)
          def py(v): return chart_y0 + chart_inner_h * (vmax - v) / (vmax - vmin)
          draw.line((chart_x0, chart_y0, chart_x0, chart_y0 + chart_inner_h, chart_x0 + chart_w, chart_y0 + chart_inner_h), fill='black', width=2)
          draw.line([(px(i), py(v)) for i, v in enumerate(values)], fill='black', width=3)
          for idx, _ in items:
              cx, cy = px(idx), py(values[idx])
              draw.ellipse((cx - 5, cy - 5, cx + 5, cy + 5), outline='black', width=2)
              draw.text((cx - 10, chart_y0 + chart_inner_h + 7), f'f{idx}', fill='black', font=F_TINY)
          draw.text((chart_x0, chart_y0 - 24), 'Hips residual X (+X → -X → +X)', fill='black', font=F_SMALL)
          note = 'Vị trí/chuyển động chân trái không được dùng để suy ra chân chịu trọng lượng: source không có foot-contact/force authority.'
          for li, line in enumerate(wrap(draw, note, width - 2 * pad, F_SMALL)[:2]):
              draw.text((pad, height - 48 + li * 20), line, fill='black', font=F_SMALL)
          out.save(src / 'weight-transfer.png', optimize=True)

          # Body mechanics: visual sequence plus exact quaternion timing evidence.
          visual = [
              (9, 'pelvis thấp'),
              (12, 'LeftUpperLeg peak Δf0'),
              (13, 'LeftFoot peak Δf0'),
              (27, 'torso peak zone'),
              (30, 'LeftLowerLeg peak Δf0'),
              (40, 'RightUpperLeg peak Δf0'),
              (49, 'loop return'),
          ]
          fw, fh, cap, gap, pad, title_h = 250, 250, 56, 10, 20, 58
          cols, rows, chart_h = 4, 2, 300
          width = pad * 2 + cols * fw + (cols - 1) * gap
          height = title_h + pad + rows * (fh + cap) + (rows - 1) * gap + pad + chart_h + 54
          out = Image.new('RGB', (width, height), 'white')
          draw = ImageDraw.Draw(out)
          draw.text((pad, 12), 'walking-2 — body mechanics: chân trái không đồng pha', fill='black', font=F_TITLE)
          y0 = title_h + pad
          for k, (idx, role) in enumerate(visual):
              row, col = divmod(k, cols)
              x = pad + col * (fw + gap)
              y = y0 + row * (fh + cap + gap)
              out.paste(frames[idx].resize((fw, fh)), (x, y))
              draw.rectangle((x, y, x + fw - 1, y + fh - 1), outline='black', width=1)
              draw.text((x + 5, y + fh + 4), f'f{idx}', fill='black', font=F_LABEL)
              for li, line in enumerate(wrap(draw, role, fw - 52, F_TINY)[:2]):
                  draw.text((x + 50, y + fh + 6 + 18 * li), line, fill='black', font=F_TINY)

          chart_y0 = title_h + pad + rows * (fh + cap) + (rows - 1) * gap + 35
          chart_x0 = pad + 55
          chart_w = width - 2 * pad - 100
          chart_inner_h = chart_h - 70
          ymax = max(max(v) for v in tracks.values()) * 1.08
          def tx(i): return chart_x0 + chart_w * i / 49
          def ty(v): return chart_y0 + chart_inner_h * (1.0 - v / ymax)
          draw.line((chart_x0, chart_y0, chart_x0, chart_y0 + chart_inner_h, chart_x0 + chart_w, chart_y0 + chart_inner_h), fill='black', width=2)
          widths = {'LeftUpperLeg': 4, 'LeftFoot': 3, 'LeftLowerLeg': 2, 'RightUpperLeg': 1}
          for name in ('LeftUpperLeg', 'LeftFoot', 'LeftLowerLeg', 'RightUpperLeg'):
              draw.line([(tx(i), ty(v)) for i, v in enumerate(tracks[name])], fill='black', width=widths[name])
          peaks = {'LeftUpperLeg': 12, 'LeftFoot': 13, 'LeftLowerLeg': 30, 'RightUpperLeg': 40}
          for name, idx in peaks.items():
              cx, cy = tx(idx), ty(tracks[name][idx])
              draw.ellipse((cx - 4, cy - 4, cx + 4, cy + 4), fill='white', outline='black', width=2)
              label_x = min(cx + 8, width - pad - 170)
              draw.text((label_x, max(chart_y0, cy - 18)), f'{name} peak f{idx}', fill='black', font=F_TINY)
          for idx in (0, 12, 13, 21, 27, 30, 40, 49):
              cx = tx(idx)
              draw.line((cx, chart_y0 + chart_inner_h, cx, chart_y0 + chart_inner_h + 6), fill='black', width=1)
              draw.text((cx - 9, chart_y0 + chart_inner_h + 8), f'f{idx}', fill='black', font=F_TINY)
          draw.text((chart_x0, chart_y0 - 25), 'Khoảng cách orientation của joint so với f0 (độ)', fill='black', font=F_SMALL)
          footer = 'Chân trái không phải một khối cứng: đùi đạt cực trị trước (f12), bàn chân gần ngay sau (f13), nhưng cẳng chân có đợt lệch lớn muộn hơn (f30). Chân phải đạt excursion đùi lớn muộn hơn ở f40.'
          for li, line in enumerate(wrap(draw, footer, width - 2 * pad, F_SMALL)[:2]):
              draw.text((pad, height - 46 + li * 20), line, fill='black', font=F_SMALL)
          out.save(src / 'body-mechanics.png', optimize=True)
          PY

      - name: Commit revised review evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sample/humanoid_motion/mixamo/walking-2/phases.png \
            sample/humanoid_motion/mixamo/walking-2/key-poses.png \
            sample/humanoid_motion/mixamo/walking-2/weight-transfer.png \
            sample/humanoid_motion/mixamo/walking-2/body-mechanics.png
          git commit -m 'review: revise walking-2 evidence with left-leg analysis'
          git push origin HEAD:review/walking-2-metadata-evidence
