name: Task Dual-Wield Motion Review

on:
  push:
    branches:
      - feat/authored-dual-wield-crosscut-attack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Author key poses then staged full motion
        shell: bash
        run: |
          set -euo pipefail
          python tests/motion/humanoid_motion/fixtures/.task_dual_wield_author.py
          python tests/motion/humanoid_motion/fixtures/.task_dual_wield_full.py
          ANIM=tests/motion/humanoid_motion/fixtures/dual-wield-crosscut-attack/animation.json
          python - "$ANIM" <<'PY'
          import sys
          from pathlib import Path
          from motion2sheet.motion.humanoid_motion.schema import OPTIONAL_FINGER_JOINTS, read_animation
          p=Path(sys.argv[1]); d=read_animation(p)
          assert d['id'] == 'dual-wield-crosscut-attack'
          assert d['frameCount'] == 43
          assert d['fps'] == 30.0
          assert abs(d['durationSeconds'] - 1.4) < 1e-9
          assert d['loop'] is False
          assert set(OPTIONAL_FINGER_JOINTS).issubset(d['joints'])
          assert len(OPTIONAL_FINGER_JOINTS) == 30
          assert all(max(abs(c) for c in v) == 0.0 for v in d['root']['translations'])
          assert 'mixamorig' not in p.read_text(encoding='utf-8').lower()
          print('FINAL_SCHEMA_PASS frames=43 fps=30 duration=1.4 fingers=30 root=in-place sourceNames=clean')
          PY
          sha256sum "$ANIM" | tee /tmp/animation-before.sha

      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb

      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'

      - name: Prepare existing character fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/task-dual-wield-character
          mapfile -t META < <(python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('tests/motion/humanoid_motion/fixtures/release_assets.json').read_text())['assets']['character-a']
          print(a['url']); print(a['sha256']); print(a['size'])
          PY
          )
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/character-a.fbx" "${META[0]}"
          echo "${META[1]}  $RUNNER_TEMP/character-a.fbx" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/character-a.fbx")" -eq "${META[2]}"
          motion2sheet export-character "$RUNNER_TEMP/character-a.fbx" --output build/task-dual-wield-character
          test -s build/task-dual-wield-character/model.glb
          test -s build/task-dual-wield-character/rig.json
          test -s build/task-dual-wield-character/skin.json

      - name: Render full motion front and three-quarter
        shell: bash
        run: |
          set -euo pipefail
          ANIM=tests/motion/humanoid_motion/fixtures/dual-wield-crosscut-attack/animation.json
          ROOT=build/task-dual-wield-full
          mkdir -p "$ROOT"
          cat > "$ROOT/three-quarter.json5" <<'JSON'
          {
            "schema": "motion2sheet.camera",
            "version": 1,
            "id": "three_quarter_humanoid_motion",
            "projection": "ORTHO",
            "location": [4.2, -4.2, 1.05],
            "target": [0.0, 0.0, 1.05],
            "upAxis": [0.0, 0.0, 1.0],
            "orthoScale": 3.0,
            "followRoot": false,
            "margin": 1.0
          }
          JSON
          COMMON=(
            --model build/task-dual-wield-character/model.glb
            --character-rig build/task-dual-wield-character/rig.json
            --skin build/task-dual-wield-character/skin.json
            --character-mapping profiles/humanoid_motion/mixamo_humanoid_v1.json
            --animation "$ANIM"
            --canvas 224x224
            --sheet-columns 8
            --render-samples 1
            --gif
          )
          motion2sheet render-humanoid-animation "${COMMON[@]}" \
            --camera-profile profiles/cameras/front_humanoid_motion.json5 \
            --output "$ROOT/front"
          motion2sheet render-humanoid-animation "${COMMON[@]}" \
            --camera-profile "$ROOT/three-quarter.json5" \
            --output "$ROOT/three-quarter"
          test -s "$ROOT/front/preview.gif"
          test -s "$ROOT/three-quarter/preview.gif"
          test -s "$ROOT/front/pose_sheet.png"
          test -s "$ROOT/three-quarter/pose_sheet.png"
          sha256sum "$ANIM" | tee /tmp/animation-after.sha
          cmp /tmp/animation-before.sha /tmp/animation-after.sha
          cp "$ANIM" "$ROOT/animation.json"
          cp tests/motion/humanoid_motion/fixtures/dual-wield-crosscut-attack/timing.txt "$ROOT/timing.txt"

          python - "$ROOT" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path(sys.argv[1])
          wanted=[0,4,7,8,9,10,11,13,16,19,22,23,24,25,26,28,31,36,42]
          for camera in ('front','three-quarter'):
              gif_path=root/camera/'preview.gif'
              gif=Image.open(gif_path)
              assert gif.n_frames >= 1
              duration=sum((gif.seek(i), gif.info.get('duration',0))[1] for i in range(gif.n_frames))
              # GIF may coalesce identical impact-hold frames; pose_sheet retains all 43 source frames.
              pose_sheet=Image.open(root/camera/'pose_sheet.png').convert('RGBA')
              tiles=[]
              for idx in wanted:
                  x=(idx%8)*224; y=(idx//8)*224
                  frame=pose_sheet.crop((x,y,x+224,y+224))
                  bg=Image.new('RGBA',frame.size,(245,245,245,255)); bg.alpha_composite(frame)
                  tile=Image.new('RGB',(224,246),'white')
                  tile.paste(bg.convert('RGB'),(0,0))
                  ImageDraw.Draw(tile).text((6,228),f'f{idx}',fill='black')
                  tiles.append(tile)
              cols=5; rows=(len(tiles)+cols-1)//cols
              sheet=Image.new('RGB',(224*cols,246*rows),'white')
              for i,tile in enumerate(tiles):
                  sheet.paste(tile,((i%cols)*224,(i//cols)*246))
              sheet.save(root/f'final-contact-{camera}.png')
              print(f'{camera}: gifImages={gif.n_frames} gifDurationMs={duration} gifBytes={gif_path.stat().st_size}')
          print('FULL_VISUAL_GATE_RENDER_PASS')
          PY

      - name: Upload full-motion visual gate
        uses: actions/upload-artifact@v4
        with:
          name: task-dual-wield-full-motion-gate
          path: build/task-dual-wield-full
          if-no-files-found: error
          retention-days: 7
