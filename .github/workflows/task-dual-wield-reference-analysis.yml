name: Task Dual-Wield Motion Review

on:
  push:
    branches:
      - feat/authored-dual-wield-crosscut-attack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Author and validate eight key poses
        shell: bash
        run: |
          set -euo pipefail
          python tests/motion/humanoid_motion/fixtures/.task_dual_wield_author.py
          ANIM=tests/motion/humanoid_motion/fixtures/dual-wield-crosscut-attack/keypose_review.json
          python - "$ANIM" <<'PY'
          import sys
          from pathlib import Path
          from motion2sheet.motion.humanoid_motion.schema import OPTIONAL_FINGER_JOINTS, read_animation
          p=Path(sys.argv[1]); d=read_animation(p)
          assert d['frameCount']==8 and d['fps']==30.0 and d['loop'] is False
          assert abs(d['durationSeconds'] - 7/30) < 1e-9
          assert set(OPTIONAL_FINGER_JOINTS).issubset(d['joints']) and len(OPTIONAL_FINGER_JOINTS)==30
          assert all(max(abs(c) for c in v)==0.0 for v in d['root']['translations'])
          print('KEYPOSE_SCHEMA_PASS frames=8 fingers=30 root=in-place')
          PY
          sha256sum "$ANIM" | tee /tmp/animation-before.sha
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Prepare existing character fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/task-dual-wield-character
          mapfile -t META < <(python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('tests/motion/humanoid_motion/fixtures/release_assets.json').read_text())['assets']['character-a']
          print(a['url']); print(a['sha256']); print(a['size'])
          PY
          )
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/character-a.fbx" "${META[0]}"
          echo "${META[1]}  $RUNNER_TEMP/character-a.fbx" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/character-a.fbx")" -eq "${META[2]}"
          motion2sheet export-character "$RUNNER_TEMP/character-a.fbx" --output build/task-dual-wield-character
      - name: Render front and three-quarter visual gate
        shell: bash
        run: |
          set -euo pipefail
          ANIM=tests/motion/humanoid_motion/fixtures/dual-wield-crosscut-attack/keypose_review.json
          mkdir -p build/task-dual-wield-keyposes
          cat > build/task-dual-wield-keyposes/three-quarter.json5 <<'JSON'
          {
            "schema": "motion2sheet.camera",
            "version": 1,
            "id": "three_quarter_humanoid_motion",
            "projection": "ORTHO",
            "location": [4.2, -4.2, 1.05],
            "target": [0.0, 0.0, 1.05],
            "upAxis": [0.0, 0.0, 1.0],
            "orthoScale": 3.0,
            "followRoot": false,
            "margin": 1.0
          }
          JSON
          COMMON=(
            --model build/task-dual-wield-character/model.glb
            --character-rig build/task-dual-wield-character/rig.json
            --skin build/task-dual-wield-character/skin.json
            --character-mapping profiles/humanoid_motion/mixamo_humanoid_v1.json
            --animation "$ANIM"
            --canvas 224x224
            --sheet-columns 8
            --render-samples 1
          )
          motion2sheet render-humanoid-animation "${COMMON[@]}" \
            --camera-profile profiles/cameras/front_humanoid_motion.json5 \
            --output build/task-dual-wield-keyposes/front
          motion2sheet render-humanoid-animation "${COMMON[@]}" \
            --camera-profile build/task-dual-wield-keyposes/three-quarter.json5 \
            --output build/task-dual-wield-keyposes/three-quarter
          test -s build/task-dual-wield-keyposes/front/pose_sheet.png
          test -s build/task-dual-wield-keyposes/three-quarter/pose_sheet.png
          sha256sum "$ANIM" | tee /tmp/animation-after.sha
          cmp /tmp/animation-before.sha /tmp/animation-after.sha
          cp "$ANIM" build/task-dual-wield-keyposes/keypose_review.json
          cp tests/motion/humanoid_motion/fixtures/dual-wield-crosscut-attack/keypose_labels.txt build/task-dual-wield-keyposes/keypose_labels.txt
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('build/task-dual-wield-keyposes')
          labels=[line.split(': ',1)[1] for line in (root/'keypose_labels.txt').read_text().splitlines()]
          rows=[]
          for camera in ('front','three-quarter'):
              sheet=Image.open(root/camera/'pose_sheet.png').convert('RGB')
              tile_w=224; tile_h=224; label_h=34; title_h=28
              row=Image.new('RGB',(tile_w*8,title_h+tile_h+label_h),'white')
              d=ImageDraw.Draw(row); d.text((6,6),camera,fill='black')
              for i,label in enumerate(labels):
                  crop=sheet.crop((i*tile_w,0,(i+1)*tile_w,tile_h))
                  row.paste(crop,(i*tile_w,title_h))
                  d.text((i*tile_w+4,title_h+tile_h+6),f'{i} {label}',fill='black')
              rows.append(row)
          gate=Image.new('RGB',(rows[0].width,rows[0].height*2),'white')
          gate.paste(rows[0],(0,0)); gate.paste(rows[1],(0,rows[0].height))
          gate.save(root/'visual-gate.png')
          print('VISUAL_GATE_RENDER_PASS')
          PY
      - name: Upload key-pose visual gate
        uses: actions/upload-artifact@v4
        with:
          name: task-dual-wield-keypose-gate
          path: build/task-dual-wield-keyposes
          if-no-files-found: error
          retention-days: 7
