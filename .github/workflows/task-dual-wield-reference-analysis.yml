name: Task Dual-Wield Motion Review

on:
  push:
    branches:
      - feat/authored-dual-wield-crosscut-attack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Author and validate canonical candidate
        run: |
          set -euo pipefail
          python tests/motion/humanoid_motion/fixtures/.task_dual_wield_author.py
          ANIM=tests/motion/humanoid_motion/fixtures/dual-wield-crosscut-attack/animation.json
          python - "$ANIM" <<'PY'
          import json, math, sys
          from pathlib import Path
          from motion2sheet.motion.humanoid_motion.schema import OPTIONAL_FINGER_JOINTS, read_animation
          p=Path(sys.argv[1]); d=read_animation(p)
          assert d['frameCount']==61 and d['fps']==30.0 and d['durationSeconds']==2.0 and d['loop'] is False
          assert set(OPTIONAL_FINGER_JOINTS).issubset(d['joints']) and len(OPTIONAL_FINGER_JOINTS)==30
          assert all(max(abs(c) for c in v)==0.0 for v in d['root']['translations'])
          assert 'mixamorig' not in p.read_text(encoding='utf-8').lower()
          print('FOCUSED_SCHEMA_PASS frames=61 fps=30 duration=2.0 fingers=30 root=in-place sourceNames=clean')
          PY
          sha256sum "$ANIM" | tee /tmp/animation-before.sha
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Prepare existing character fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/task-dual-wield-character
          mapfile -t META < <(python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('tests/motion/humanoid_motion/fixtures/release_assets.json').read_text())['assets']['character-a']
          print(a['url']); print(a['sha256']); print(a['size'])
          PY
          )
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/character-a.fbx" "${META[0]}"
          echo "${META[1]}  $RUNNER_TEMP/character-a.fbx" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/character-a.fbx")" -eq "${META[2]}"
          motion2sheet export-character "$RUNNER_TEMP/character-a.fbx" --output build/task-dual-wield-character
          test -s build/task-dual-wield-character/model.glb
          test -s build/task-dual-wield-character/rig.json
          test -s build/task-dual-wield-character/skin.json
      - name: Render 224px front-camera motion review
        shell: bash
        run: |
          set -euo pipefail
          ANIM=tests/motion/humanoid_motion/fixtures/dual-wield-crosscut-attack/animation.json
          OUT=build/task-dual-wield-proof
          motion2sheet render-humanoid-animation \
            --model build/task-dual-wield-character/model.glb \
            --character-rig build/task-dual-wield-character/rig.json \
            --skin build/task-dual-wield-character/skin.json \
            --character-mapping profiles/humanoid_motion/mixamo_humanoid_v1.json \
            --animation "$ANIM" \
            --camera-profile profiles/cameras/front_humanoid_motion.json5 \
            --canvas 224x224 \
            --sheet-columns 8 \
            --render-samples 1 \
            --gif \
            --output "$OUT"
          test -s "$OUT/preview.gif"
          test -s "$OUT/render.json"
          sha256sum "$ANIM" | tee /tmp/animation-after.sha
          cmp /tmp/animation-before.sha /tmp/animation-after.sha
          cp "$ANIM" "$OUT/animation.json"
          python - "$OUT" <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image, ImageDraw
          out=Path(sys.argv[1]); gif=Image.open(out/'preview.gif'); n=gif.n_frames
          wanted=[0,8,14,18,20,25,31,34,36,43,50,60]
          tiles=[]
          for idx in wanted:
              gif.seek(min(idx,n-1)); fr=gif.convert('RGBA')
              bg=Image.new('RGBA',fr.size,(245,245,245,255)); bg.alpha_composite(fr); bg=bg.convert('RGB')
              tile=Image.new('RGB',(224,246),'white'); tile.paste(bg,(0,0)); ImageDraw.Draw(tile).text((6,228),f'f{idx}',fill='black'); tiles.append(tile)
          sheet=Image.new('RGB',(224*4,246*3),'white')
          for i,t in enumerate(tiles): sheet.paste(t,((i%4)*224,(i//4)*246))
          sheet.save(out/'key-poses.png')
          report=json.loads((out/'render.json').read_text())
          print(f"RENDER_PASS gifBytes={(out/'preview.gif').stat().st_size} gifFrames={n}")
          print('RENDER_KEYS', sorted(report.keys()))
          PY
      - name: Upload candidate review proof
        uses: actions/upload-artifact@v4
        with:
          name: task-dual-wield-motion-review
          path: build/task-dual-wield-proof
          if-no-files-found: error
          retention-days: 7
