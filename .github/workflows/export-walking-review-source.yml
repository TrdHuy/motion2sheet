name: Build walking metadata evidence

on:
  push:
    branches:
      - metadata-review/mixamo-walking

permissions:
  contents: write

jobs:
  build-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install evidence dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build evidence from trusted source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          base = Path('sample/humanoid_motion/mixamo/walking')
          data = json.loads((base / 'animation.json').read_text())
          gif = Image.open(base / 'preview.gif')

          assert data['frameCount'] == 42, data['frameCount']
          assert gif.n_frames == 42, gif.n_frames
          assert data['fps'] == 30.0, data['fps']
          assert data['loop'] is True

          frames = []
          for i in range(gif.n_frames):
              gif.seek(i)
              frames.append(gif.convert('RGB').copy())

          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          small = ImageFont.truetype(font_path, 19)
          bold = ImageFont.truetype(bold_path, 25)
          title_font = ImageFont.truetype(bold_path, 31)

          def fit_frame(i, size):
              return frames[i].resize((size, size), Image.Resampling.LANCZOS)

          def save_png(img, path):
              img.save(path, optimize=True)

          def make_grid(path, title, items, cols, frame_size=336, label_h=58):
              rows = (len(items) + cols - 1) // cols
              top = 58
              canvas = Image.new('RGB', (cols * frame_size, top + rows * (frame_size + label_h)), 'white')
              draw = ImageDraw.Draw(canvas)
              draw.text((16, 12), title, fill='black', font=title_font)
              for n, (idx, label) in enumerate(items):
                  x = (n % cols) * frame_size
                  y = top + (n // cols) * (frame_size + label_h)
                  canvas.paste(fit_frame(idx, frame_size), (x, y))
                  draw.rectangle((x, y + frame_size, x + frame_size, y + frame_size + label_h), fill='white')
                  draw.text((x + 10, y + frame_size + 7), f'f{idx} · {label}', fill='black', font=small)
              save_png(canvas, path)

          make_grid(
              base / 'phases.png',
              'walking — phase boundary evidence',
              [
                  (0, 'bắt đầu vòng'),
                  (10, 'kết thúc phase 1'),
                  (11, 'bắt đầu phase 2'),
                  (21, 'kết thúc phase 2'),
                  (22, 'bắt đầu phase 3'),
                  (30, 'kết thúc phase 3'),
                  (31, 'bắt đầu phase 4'),
                  (41, 'khép vòng về f0'),
              ],
              cols=4,
          )

          make_grid(
              base / 'key-poses.png',
              'walking — key pose evidence',
              [
                  (11, 'cực trị sải bước đầu'),
                  (16, 'co gối phải cực đại'),
                  (30, 'cực trị sải bước đối diện'),
                  (36, 'co gối trái cực đại'),
              ],
              cols=2,
              frame_size=420,
              label_h=62,
          )

          selected = [0, 10, 23, 35, 40]
          hip = data['hips']['translations']
          panel = 280
          top = 62
          label_h = 70
          chart_h = 245
          width = panel * len(selected)
          height = top + panel + label_h + chart_h * 2 + 72
          wt = Image.new('RGB', (width, height), 'white')
          draw = ImageDraw.Draw(wt)
          draw.text((16, 13), 'walking — pelvis sway / bob evidence', fill='black', font=title_font)
          for n, idx in enumerate(selected):
              x = n * panel
              wt.paste(fit_frame(idx, panel), (x, top))
              hx, hy, hz = hip[idx]
              draw.text((x + 8, top + panel + 7), f'f{idx} · pelvis x={hx:+.4f}', fill='black', font=small)
              draw.text((x + 8, top + panel + 35), f'z={hz:+.4f}', fill='black', font=small)

          def draw_curve(y0, values, label, marked):
              left, right = 78, width - 28
              plot_top, plot_bottom = y0 + 42, y0 + chart_h - 34
              draw.text((18, y0 + 5), label, fill='black', font=bold)
              draw.line((left, plot_bottom, right, plot_bottom), fill='black', width=2)
              draw.line((left, plot_top, left, plot_bottom), fill='black', width=2)
              lo, hi = min(values), max(values)
              span = hi - lo or 1.0
              pts = []
              for i, val in enumerate(values):
                  px = left + (right - left) * i / (len(values) - 1)
                  py = plot_bottom - (plot_bottom - plot_top) * (val - lo) / span
                  pts.append((px, py))
              draw.line(pts, fill=(45, 45, 45), width=4)
              for idx in marked:
                  px, py = pts[idx]
                  r = 6
                  draw.ellipse((px-r, py-r, px+r, py+r), fill='black')
                  draw.text((px + 8, py - 12), f'f{idx}', fill='black', font=small)
              draw.text((left, plot_bottom + 6), 'f0', fill='black', font=small)
              draw.text((right - 34, plot_bottom + 6), 'f41', fill='black', font=small)
              draw.text((8, plot_top - 10), f'{hi:+.4f}', fill='black', font=small)
              draw.text((8, plot_bottom - 10), f'{lo:+.4f}', fill='black', font=small)

          xvals = [v[0] for v in hip]
          zvals = [v[2] for v in hip]
          chart_start = top + panel + label_h
          draw_curve(chart_start, xvals, 'Pelvis X (+X = phải): cực trị phải f10, cực trị trái f40', [0, 10, 40])
          draw_curve(chart_start + chart_h, zvals, 'Pelvis Z (+Z = lên): cao nhất f23, thấp nhất f35', [23, 35])
          draw.text((18, height - 48), 'Không gán chân trụ: source không có contact flag hoặc vị trí joint/ground-contact.', fill='black', font=small)
          save_png(wt, base / 'weight-transfer.png')

          make_grid(
              base / 'body-mechanics.png',
              'walking — body coordination evidence',
              [
                  (9, 'thân trên xoay cực trị A'),
                  (11, 'sải chân A đạt cực trị'),
                  (29, 'thân trên xoay cực trị B'),
                  (30, 'sải chân B đạt cực trị'),
              ],
              cols=2,
              frame_size=420,
              label_h=62,
          )

          bm = Image.open(base / 'body-mechanics.png').convert('RGB')
          footer = 88
          out = Image.new('RGB', (bm.width, bm.height + footer), 'white')
          out.paste(bm, (0, 0))
          d2 = ImageDraw.Draw(out)
          d2.text((14, bm.height + 8), 'animation.json: chest/shoulder reversal ≈ f9↔f29;', fill='black', font=small)
          d2.text((14, bm.height + 38), 'opposite upper-leg stride extrema ≈ f11↔f30.', fill='black', font=small)
          save_png(out, base / 'body-mechanics.png')
          PY
      - name: Commit evidence only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sample/humanoid_motion/mixamo/walking/phases.png \
            sample/humanoid_motion/mixamo/walking/key-poses.png \
            sample/humanoid_motion/mixamo/walking/weight-transfer.png \
            sample/humanoid_motion/mixamo/walking/body-mechanics.png
          git commit -m 'review: refresh walking metadata evidence'
          git push origin HEAD:metadata-review/mixamo-walking
