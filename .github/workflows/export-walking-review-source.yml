name: Export walking review source

on:
  push:
    branches:
      - metadata-review/mixamo-walking

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Package walking source
        uses: actions/upload-artifact@v4
        with:
          name: walking-review-source
          if-no-files-found: error
          path: |
            sample/humanoid_motion/mixamo/walking/animation.json
            sample/humanoid_motion/mixamo/walking/preview.gif
