name: Metadata Evidence Review Helper

on:
  push:
    branches:
      - metadata-evidence/action-idle-to-standing-idle

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install evidence dependencies
        run: python -m pip install pillow matplotlib
      - name: Generate evidence from trusted source
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import io, json, math, textwrap
          import matplotlib.pyplot as plt

          src = Path('sample/humanoid_motion/mixamo/action-idle-to-standing-idle')
          motion = json.loads((src / 'animation.json').read_text())
          gif = Image.open(src / 'preview.gif')
          frames = []
          idx = 0
          while True:
              try:
                  gif.seek(idx)
              except EOFError:
                  break
              frames.append(gif.convert('RGB').copy())
              idx += 1

          assert len(frames) == motion['frameCount'] == 29, (len(frames), motion['frameCount'])
          assert motion['fps'] == 30.0

          def font(size, bold=False):
              path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
              return ImageFont.truetype(path, size)

          title_font = font(24, True)
          role_font = font(16, True)
          body_font = font(13)
          foot_font = font(11)

          def wrapped(draw, xy, text, width, fnt, fill='black', spacing=3):
              approx = max(14, int(width / max(7, fnt.size * 0.55)))
              lines = textwrap.wrap(text, width=approx) or ['']
              draw.multiline_text(xy, '\n'.join(lines), font=fnt, fill=fill, spacing=spacing)

          def make_grid(path, title, items, cols, footer=''):
              cell_w, cell_h = frames[0].size
              title_h, label_h, footer_h = 52, 96, (60 if footer else 0)
              rows = math.ceil(len(items) / cols)
              canvas = Image.new('RGB', (cols * cell_w, title_h + rows * (cell_h + label_h) + footer_h), 'white')
              draw = ImageDraw.Draw(canvas)
              draw.text((16, 12), title, font=title_font, fill='black')
              for n, (fi, role, detail) in enumerate(items):
                  c, r = n % cols, n // cols
                  x, y = c * cell_w, title_h + r * (cell_h + label_h)
                  canvas.paste(frames[fi], (x, y))
                  ly = y + cell_h
                  draw.rectangle((x, ly, x + cell_w - 1, ly + label_h - 1), fill='white', outline='black')
                  draw.text((x + 7, ly + 6), f'f{fi} — {role}', font=role_font, fill='black')
                  wrapped(draw, (x + 7, ly + 30), detail, cell_w - 14, body_font)
              if footer:
                  fy = title_h + rows * (cell_h + label_h)
                  wrapped(draw, (16, fy + 8), footer, canvas.width - 32, foot_font)
              canvas.save(path)

          hips = motion['hips']['translations']
          xs = [p[0] for p in hips]
          ys = [p[1] for p in hips]
          zs = [p[2] for p in hips]
          f_z_min = min(range(len(zs)), key=zs.__getitem__)
          f_y_max = max(range(len(ys)), key=ys.__getitem__)
          f_x_max = max(range(len(xs)), key=xs.__getitem__)
          f_y_min = min(range(len(ys)), key=ys.__getitem__)
          assert (f_z_min, f_y_max, f_x_max, f_y_min) == (3, 6, 13, 22)

          root_yaw = []
          for q in motion['root']['rotations']:
              w, x, y, z = q
              root_yaw.append(math.degrees(2.0 * math.atan2(z, w)))
          f_root_yaw_max = max(range(len(root_yaw)), key=root_yaw.__getitem__)
          assert f_root_yaw_max == 23

          make_grid(
              src / 'phases.png',
              'Phase boundary evidence — action-idle-to-standing-idle',
              [
                  (0, 'start', 'Action-idle source pose'),
                  (3, 'phase 1 end', 'Pelvis Z minimum'),
                  (4, 'phase 2 start', 'Rise / main turn begins'),
                  (13, 'phase 2 end', 'Pelvis X maximum'),
                  (14, 'phase 3 start', 'Re-centering / upright alignment'),
                  (23, 'phase 3 end', 'Root yaw maximum'),
                  (24, 'phase 4 start', 'Standing settle begins'),
                  (28, 'end', 'Standing-idle target pose'),
              ],
              4,
              'Boundary facts from animation.json: pelvis Z reaches its minimum at f3; pelvis X reaches its maximum at f13; root yaw reaches its maximum at f23 before the final settle.'
          )

          make_grid(
              src / 'key-poses.png',
              'Key poses — action-idle-to-standing-idle',
              [
                  (0, 'action-idle start', 'Low, asymmetric ready stance'),
                  (3, 'lowest pelvis', 'Small final dip before rising'),
                  (10, 'mid-rise drive', 'Left upper-leg rotation change peaks here'),
                  (23, 'turn complete', 'Root yaw peaks; posture is nearly standing'),
                  (28, 'standing-idle end', 'Neutral upright target'),
              ],
              5,
              'Only semantic / mechanically distinctive poses are retained; intermediate interpolation frames are omitted.'
          )

          wt_items = [
              (0, 'start'),
              (3, 'Z min'),
              (6, 'Y max (rearward)'),
              (13, 'X max (rightward)'),
              (22, 'Y min (forward)'),
              (28, 're-centered end'),
          ]
          cell_w, cell_h = frames[0].size
          cols = len(wt_items)
          title_h, label_h, chart_h, footer_h = 54, 34, 390, 58
          wt = Image.new('RGB', (cols * cell_w, title_h + cell_h + label_h + chart_h + footer_h), 'white')
          d = ImageDraw.Draw(wt)
          d.text((12, 10), 'Weight-transfer evidence — pelvis translation / COM proxy', font=title_font, fill='black')
          for n, (fi, lab) in enumerate(wt_items):
              x = n * cell_w
              wt.paste(frames[fi], (x, title_h))
              ly = title_h + cell_h
              d.rectangle((x, ly, x + cell_w - 1, ly + label_h - 1), fill='white', outline='black')
              d.text((x + 5, ly + 8), f'f{fi} — {lab}', font=body_font, fill='black')

          fig, ax = plt.subplots(figsize=(14.8, 3.8), dpi=100)
          fr = list(range(len(hips)))
          ax.plot(fr, xs, marker='.', linewidth=1.3, markersize=3, label='Hips X (+ = right)')
          ax.plot(fr, ys, marker='.', linewidth=1.3, markersize=3, label='Hips Y (+ = rearward; − = forward)')
          ax.plot(fr, zs, marker='.', linewidth=1.3, markersize=3, label='Hips Z (+ = up)')
          for fi in [0, 3, 6, 13, 22, 28]:
              ax.axvline(fi, alpha=0.18)
          for fi, val in [(0, zs[0]), (3, zs[3]), (6, ys[6]), (13, xs[13]), (22, ys[22]), (28, ys[28])]:
              ax.annotate(f'f{fi}', (fi, val), fontsize=8)
          ax.set_title('Pelvis translation by frame (source coordinates; unit = mean-leg-length)')
          ax.set_xlabel('Frame')
          ax.set_ylabel('Translation')
          ax.grid(True, alpha=0.25)
          ax.legend(loc='upper right', fontsize=8)
          fig.tight_layout()
          buf = io.BytesIO()
          fig.savefig(buf, format='png')
          plt.close(fig)
          buf.seek(0)
          chart = Image.open(buf).convert('RGB').resize((wt.width, chart_h))
          wt.paste(chart, (0, title_h + cell_h + label_h))
          footer = ('Interpretation: pelvis shifts right/back early (Y max f6; X max f13), then forward and toward center while rising '
                    '(Y min f22; Z rises after f3). Pelvis translation is used as a center-of-mass proxy. No support-foot label is asserted: '
                    'the source has no explicit contact channel, and preview alone does not prove which foot bears load.')
          wrapped(d, (12, title_h + cell_h + label_h + chart_h + 8), footer, wt.width - 24, foot_font)
          wt.save(src / 'weight-transfer.png')

          def q_delta_deg(a, b):
              dot = abs(sum(x*y for x, y in zip(a, b)))
              dot = max(-1.0, min(1.0, dot))
              return math.degrees(2.0 * math.acos(dot))

          def peak_delta(joint):
              qs = motion['joints'][joint]['rotations']
              ds = [0.0] + [q_delta_deg(qs[i], qs[i-1]) for i in range(1, len(qs))]
              fi = max(range(len(ds)), key=ds.__getitem__)
              return fi, ds[fi]

          peaks = {j: peak_delta(j) for j in [
              'Spine', 'Chest', 'LeftShoulder', 'RightShoulder',
              'LeftUpperArm', 'RightUpperArm', 'LeftLowerArm', 'RightLowerArm',
              'LeftUpperLeg', 'LeftLowerLeg', 'RightUpperLeg', 'RightLowerLeg'
          ]}
          assert peaks['Spine'][0] == 3
          assert peaks['LeftUpperArm'][0] == 3 and peaks['RightUpperArm'][0] == 3
          assert peaks['LeftLowerLeg'][0] == 8 and peaks['LeftUpperLeg'][0] == 10
          assert peaks['RightUpperLeg'][0] == 14
          assert peaks['Chest'][0] == 20 and peaks['LeftShoulder'][0] == 20 and peaks['RightShoulder'][0] == 20
          assert peaks['RightLowerLeg'][0] == 23

          make_grid(
              src / 'body-mechanics.png',
              'Body mechanics — action-idle-to-standing-idle',
              [
                  (3, 'opening unwind', 'Arms + spine are in their strongest early-change window; pelvis is at its lowest'),
                  (9, 'left-leg extension', 'Left lower leg peaked at f8; left upper leg approaches its f10 peak'),
                  (14, 'right-thigh follow', 'Right upper-leg frame-to-frame rotation change peaks at f14'),
                  (20, 'upper-body align', 'Chest and both shoulders enter their strongest late adjustment at f20–21'),
                  (23, 'turn completion', f'Right lower leg peaks at f23; root yaw is {root_yaw[23]:.2f}° and maximal'),
                  (28, 'neutral settle', 'Standing-idle target after the turn'),
              ],
              3,
              'Motion-data ordering uses frame-to-frame quaternion rotation magnitude Δθ = 2·acos(|q[f]·q[f−1]|): arms/spine peak around f2–3 → left lower/upper leg around f8/f10 → right upper leg f14 → chest/shoulders f20–21 → right lower leg f23.'
          )
          PY
      - name: Commit evidence files
        shell: bash
        run: |
          set -euo pipefail
          target='sample/humanoid_motion/mixamo/action-idle-to-standing-idle'
          git add "$target/phases.png" "$target/key-poses.png" "$target/weight-transfer.png" "$target/body-mechanics.png"
          if git diff --cached --quiet; then
            echo 'Evidence files already committed; nothing to push.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add evidence for action idle to standing idle metadata review'
          git push origin HEAD:metadata-evidence/action-idle-to-standing-idle
