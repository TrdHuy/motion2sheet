name: Motion Profile Conversion POC

on:
  pull_request:
    paths:
      - 'motion2sheet/motion/conversion/**'
      - 'motion2sheet/motion/cli.py'
      - 'profiles/retarget/**'
      - 'profiles/anim2sheet/rigs/game_humanoid_v2.json5'
      - 'profiles/anim2sheet/characters/swordsman_v1.json5'
      - 'tests/motion/conversion/**'
      - '.github/workflows/motion-conversion.yml'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      command:
        description: Contract B to Contract A proof path
        required: true
        default: convert-and-render
        type: choice
        options:
          - convert
          - convert-and-render

permissions:
  contents: read

jobs:
  mixamo-contract-conversion:
    name: mixamo-contract-conversion / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.command) || '["convert","convert-and-render"]') }}
    env:
      MODE: ${{ matrix.mode }}
      ROOT: build/motion_profile_conversion/walk_mixamo
      TARGET_RIG: profiles/anim2sheet/rigs/game_humanoid_v2.json5
      MAPPING: profiles/retarget/mixamo_to_game_humanoid_v2.json5
      CHARACTER: profiles/anim2sheet/characters/swordsman_v1.json5
      CAMERA: profiles/anim2sheet/cameras/fast_keypose_review.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Contract B to A unit tests
        run: pytest tests/motion/conversion/test_converter.py
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version
      - name: Existing public export-animation-json produces Contract B
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          motion2sheet export-animation-json sample/walk_mixamo.fbx --output "$ROOT/contract-b"
          test -f "$ROOT/contract-b/rig.json"
          test -f "$ROOT/contract-b/animation.json"
      - name: PR 11 source JSON visual proof
        if: env.MODE == 'convert-and-render'
        run: |
          set -euo pipefail
          motion2sheet render-animation-json --rig "$ROOT/contract-b/rig.json" --animation "$ROOT/contract-b/animation.json" --renderer blender --gif --output "$ROOT/source-json"
          test -f "$ROOT/source-json/pose_sheet.png"
          test -f "$ROOT/source-json/preview.gif"
      - name: Withhold original source FBX before conversion
        run: |
          set -euo pipefail
          rm sample/walk_mixamo.fbx
          test ! -e sample/walk_mixamo.fbx
      - name: Public convert-animation-profile produces real Contract A
        run: |
          set -euo pipefail
          motion2sheet convert-animation-profile \
            --source-rig "$ROOT/contract-b/rig.json" \
            --source-animation "$ROOT/contract-b/animation.json" \
            --target-rig "$TARGET_RIG" \
            --mapping "$MAPPING" \
            --character-profile "$CHARACTER" \
            --output "$ROOT/contract-a"
          test ! -e sample/walk_mixamo.fbx
          test -f "$ROOT/contract-a/motion.json"
          test -f "$ROOT/contract-a/animation.json5"
          test -f "$ROOT/contract-a/conversion.json"
      - name: Verify real Mixamo conversion is byte deterministic
        run: |
          set -euo pipefail
          motion2sheet convert-animation-profile \
            --source-rig "$ROOT/contract-b/rig.json" \
            --source-animation "$ROOT/contract-b/animation.json" \
            --target-rig "$TARGET_RIG" \
            --mapping "$MAPPING" \
            --character-profile "$CHARACTER" \
            --output "$ROOT/contract-a-repeat"
          cmp "$ROOT/contract-a/motion.json" "$ROOT/contract-a-repeat/motion.json"
          cmp "$ROOT/contract-a/animation.json5" "$ROOT/contract-a-repeat/animation.json5"
          cmp "$ROOT/contract-a/conversion.json" "$ROOT/contract-a-repeat/conversion.json"
          rm -rf "$ROOT/contract-a-repeat"
      - name: Validate generated Contract A through existing loaders
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from motion2sheet.anim2sheet.common.profile import load_motion_profile, load_rig_profile, resolve_review_request
          root = Path("build/motion_profile_conversion/walk_mixamo/contract-a")
          target = load_rig_profile(Path("profiles/anim2sheet/rigs/game_humanoid_v2.json5"))
          motion = load_motion_profile(root / "motion.json", rig_profile=target)
          assert motion["frameCount"] == 32
          assert motion["fps"] == 30.0
          resolved = resolve_review_request(profile_path=root / "animation.json5", camera_profile_path=Path("profiles/anim2sheet/cameras/fast_keypose_review.json"), frames=None, cameras="front_final")
          assert resolved["rigId"] == "game_humanoid_v2"
          assert resolved["motionProfile"]["frameCount"] == 32
          print("Contract A loader/resolver proof PASS")
          PY
      - name: Existing anim2sheet build consumes generated profile
        if: env.MODE == 'convert-and-render'
        run: |
          set -euo pipefail
          anim2sheet build --profile "$ROOT/contract-a/animation.json5" --camera-profile "$CAMERA" --cameras front_final --gif --output "$ROOT/anim2sheet"
          cp "$ROOT/anim2sheet/object_keyposes.png" "$ROOT/anim2sheet/pose_sheet.png"
          test -f "$ROOT/anim2sheet/pose_sheet.png"
          test -f "$ROOT/anim2sheet/preview.gif"
          test -f "$ROOT/anim2sheet/source.blend"
          test -f "$ROOT/anim2sheet/motion_debug.json"
          test -f "$ROOT/anim2sheet/leg_ik_debug.json"
      - name: Measure actual Anim2Sheet-consumed pose against retarget target
        if: env.MODE == 'convert-and-render'
        run: |
          set -euo pipefail
          blender --background "$ROOT/anim2sheet/source.blend" --python-exit-code 1 --python tests/motion/conversion/e2e/verify_anim2sheet_pose.py -- --conversion "$ROOT/contract-a/conversion.json" --output "$ROOT/anim2sheet/pose_fidelity.json"
      - name: Verify render artifacts and build visual comparison
        if: env.MODE == 'convert-and-render'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path("build/motion_profile_conversion/walk_mixamo")
          report = json.loads((root / "contract-a/conversion.json").read_text())
          runtime = json.loads((root / "anim2sheet/pose_fidelity.json").read_text())
          assert report["fidelity"]["pass"] is True
          assert runtime["pass"] is True
          assert report["source"]["frameCount"] == 32
          with Image.open(root / "source-json/preview.gif") as image:
              assert getattr(image, "n_frames", 1) == 32
          with Image.open(root / "anim2sheet/preview.gif") as image:
              assert getattr(image, "n_frames", 1) == 32
          source = Image.open(root / "source-json/pose_sheet.png").convert("RGBA")
          converted = Image.open(root / "anim2sheet/pose_sheet.png").convert("RGBA")
          target_size = converted.size
          source_scaled = source.resize(target_size)
          comparison = Image.new("RGBA", (target_size[0] * 2, target_size[1] + 48), (255,255,255,255))
          comparison.alpha_composite(source_scaled, (0,48))
          comparison.alpha_composite(converted, (target_size[0],48))
          draw = ImageDraw.Draw(comparison)
          draw.text((12,14), "Contract B source JSON render", fill=(0,0,0,255))
          draw.text((target_size[0]+12,14), "Converted Contract A / Anim2Sheet", fill=(0,0,0,255))
          comparison.save(root / "visual-comparison.png")
          source.close(); source_scaled.close(); converted.close(); comparison.close()
          print("conversion/render proof PASS:", "predicted max", report["fidelity"]["maxErrorMeters"], "runtime max", runtime["maxErrorMeters"])
          PY
      - name: Upload conversion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-profile-${{ env.MODE }}
          path: build/motion_profile_conversion/walk_mixamo/
          if-no-files-found: error
          retention-days: 7
