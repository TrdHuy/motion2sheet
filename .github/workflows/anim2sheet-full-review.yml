name: Full Animation Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-animation-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: pytest tests/anim2sheet/unit
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb libx11-6 libxext6 libxrender1 libxi6 libxkbcommon0 libgl1-mesa-dri
      - name: Setup Blender 4.5.12
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version
      - name: Build full 16-frame animation
        run: anim2sheet build --profile profiles/anim2sheet/swordsman/gale_slash.json5 --output build/anim/full_review
      - name: Validate full review output
        run: anim2sheet validate build/anim/full_review
      - name: Verify full-body motion semantics
        run: python tests/anim2sheet/e2e/verify_motion_semantics.py build/anim/full_review
      - name: Verify default rig exports
        run: python tests/anim2sheet/e2e/verify_rig_manifest.py build/anim/full_review
      - name: Upload full animation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion2sheet-full-animation-review
          path: build/anim/full_review/
          if-no-files-found: warn
          retention-days: 7
