name: Humanoid Motion Portability E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  humanoid-motion:
    name: humanoid-motion-e2e / three-independent-targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Humanoid Motion unit tests
        run: pytest tests/motion/humanoid_motion
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "4.5.12"
      - name: Verify Blender
        run: blender --version
      - name: Run reusable Humanoid Motion E2E proof
        run: bash tests/motion/humanoid_motion/run_e2e.sh build/motion/humanoid-motion
      - name: Upload Humanoid Motion portability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-motion-portability-e2e
          path: build/motion/humanoid-motion/
          if-no-files-found: warn
          retention-days: 7
