name: Happy Idle Evidence Finalize

on:
  push:
    branches:
      - metadata-evidence/happy-idle

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Generate exact review evidence from trusted source
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json, math, numpy as np

          src = Path('sample/humanoid_motion/mixamo/happy-idle')
          outdir = src
          anim = json.loads((src / 'animation.json').read_text(encoding='utf-8'))
          hips = np.array(anim['hips']['translations'], float)

          gif = Image.open(src / 'preview.gif')
          if getattr(gif, 'n_frames', 1) != anim['frameCount']:
              raise SystemExit(f"GIF frames {getattr(gif, 'n_frames', 1)} != animation frameCount {anim['frameCount']}")
          frames = []
          for i in range(gif.n_frames):
              gif.seek(i)
              frames.append(gif.convert('RGB').copy())

          fp = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bp = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          TITLE = ImageFont.truetype(bp, 30)
          SUB = ImageFont.truetype(fp, 18)
          PANEL_HEAD = ImageFont.truetype(bp, 22)
          CAP = ImageFont.truetype(fp, 18)
          SMALL = ImageFont.truetype(fp, 15)

          def wrap(draw, text, font, width_px):
              words = text.split()
              lines, cur = [], ''
              for word in words:
                  test = (cur + ' ' + word).strip()
                  if draw.textbbox((0, 0), test, font=font)[2] <= width_px:
                      cur = test
                  else:
                      if cur:
                          lines.append(cur)
                      cur = word
              if cur:
                  lines.append(cur)
              return lines

          def source_frame(frame, size):
              return frames[frame].resize((size, size), Image.Resampling.NEAREST)

          def make_contact_sheet(filename, title, subtitle, items, cols, panel_img, cap_h, footer):
              margin, gap, header_h = 24, 18, 100
              rows = math.ceil(len(items) / cols)
              footer_h = 56
              width = margin * 2 + cols * panel_img + (cols - 1) * gap
              height = header_h + rows * (panel_img + cap_h) + (rows - 1) * gap + margin + footer_h
              out = Image.new('RGB', (width, height), 'white')
              draw = ImageDraw.Draw(out)
              draw.text((margin, 18), title, fill='black', font=TITLE)
              draw.text((margin, 58), subtitle, fill='black', font=SUB)
              y0 = header_h
              for idx, (frame, caption) in enumerate(items):
                  row, col = divmod(idx, cols)
                  x = margin + col * (panel_img + gap)
                  y = y0 + row * (panel_img + cap_h + gap)
                  out.paste(source_frame(frame, panel_img), (x, y))
                  draw.text((x + 6, y + panel_img + 6), f'f{frame}', fill='black', font=PANEL_HEAD)
                  yy = y + panel_img + 35
                  for line in wrap(draw, caption, CAP, panel_img - 12)[:3]:
                      draw.text((x + 6, yy), line, fill='black', font=CAP)
                      yy += 22
              fy = height - footer_h
              draw.line((margin, fy - 8, width - margin, fy - 8), fill='black', width=1)
              draw.text((margin, fy + 4), footer, fill='black', font=SMALL)
              out.save(outdir / filename, optimize=True)

          make_contact_sheet(
              'phases.png',
              'happy-idle — phase boundary evidence',
              'Exact source frames used to define the four broad sway phases.',
              [
                  (0, 'P1 start — opening-side lean'),
                  (20, 'P1 end — lean unwound toward center'),
                  (21, 'P2 start — opposite sway begins'),
                  (48, 'P2 end — opposite-side sway peak'),
                  (49, 'P3 start — peak releases'),
                  (70, 'P3 end — returns through centered stance'),
                  (71, 'P4 start — opening-side lean rebuilds'),
                  (88, 'P4 end — opening pose / loop seam'),
              ],
              4, 300, 92,
              'Source image: preview.gif · Frame identity verified 1:1 against animation.json (89 samples).',
          )

          make_contact_sheet(
              'key-poses.png',
              'happy-idle — key pose evidence',
              'Only motion landmarks used as proposed key poses.',
              [
                  (0, 'opening lean / loop anchor'),
                  (11, f'highest pelvis bounce crest · Hips Z {hips[11, 2]:+.4f} MLL'),
                  (48, 'maximum visible head / upper-body lean'),
                  (54, f'deepest pelvis compression · Hips Z {hips[54, 2]:+.4f} MLL'),
                  (88, 'loop seam · opening pose restored'),
              ],
              5, 300, 100,
              'Pose images come from preview.gif; pelvis values come from animation.json.',
          )

          make_contact_sheet(
              'weight-transfer.png',
              'happy-idle — weight-transfer proxy evidence',
              'Pelvis/COM proxy trajectory only: −X (left) → +X (right) → near center / loop return.',
              [
                  (32, f'pelvis left extreme · Hips X {hips[32, 0]:+.4f} MLL'),
                  (53, f'pelvis right extreme · Hips X {hips[53, 0]:+.4f} MLL'),
                  (63, f'returns near center · Hips X {hips[63, 0]:+.4f} MLL'),
                  (88, f'opening lateral position · Hips X {hips[88, 0]:+.4f} MLL'),
              ],
              4, 330, 108,
              'Canonical right axis is +X. No foot-contact/force channel is present; support foot is not asserted.',
          )

          make_contact_sheet(
              'body-mechanics.png',
              'happy-idle — body mechanics evidence',
              'Layered coordination: lateral pelvis travel + rhythmic rise/fall, larger head/neck excursion, low relaxed arms.',
              [
                  (32, 'pelvis at left extreme; large sway arc starts'),
                  (40, 'upper-body / head tilt builds'),
                  (48, 'head / upper-body lean reaches visible peak'),
                  (54, 'pelvis reaches deepest vertical compression'),
                  (60, 'body recovers toward centered stance'),
              ],
              5, 300, 108,
              'This evidence describes overlapping coordination, not a strict causal joint-order claim.',
          )
          PY
      - name: Commit review evidence and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample/humanoid_motion/mixamo/happy-idle/phases.png
          git add sample/humanoid_motion/mixamo/happy-idle/key-poses.png
          git add sample/humanoid_motion/mixamo/happy-idle/weight-transfer.png
          git add sample/humanoid_motion/mixamo/happy-idle/body-mechanics.png
          git rm .github/workflows/happy-idle-evidence-prep.yml
          git commit -m "Add happy-idle metadata evidence"
          git push origin HEAD:metadata-evidence/happy-idle
