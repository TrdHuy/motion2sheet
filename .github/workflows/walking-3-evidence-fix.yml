name: Walking 3 Evidence Layout Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/walking-3-evidence-fix.yml'

permissions:
  contents: write

jobs:
  fix-evidence-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install pillow

      - name: Regenerate readable phase and key-pose evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('sample/humanoid_motion/mixamo/walking-3')
          animation = json.loads((root / 'animation.json').read_text())
          assert animation['id'] == 'walking-3'
          assert animation['frameCount'] == 32
          assert animation['fps'] == 30.0

          gif = Image.open(root / 'preview.gif')
          assert getattr(gif, 'n_frames', 1) == 32
          frames = []
          for i in range(32):
              gif.seek(i)
              frames.append(gif.convert('RGB').copy())

          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          title_font = ImageFont.truetype(bold, 32)
          subtitle_font = ImageFont.truetype(regular, 18)
          frame_font = ImageFont.truetype(bold, 24)
          label_font = ImageFont.truetype(regular, 15)
          label_bold = ImageFont.truetype(bold, 15)

          crop_box = (45, 42, 180, 220)
          def panel(frame_id, width, height):
              crop = frames[frame_id].crop(crop_box)
              scale = min(width / crop.width, height / crop.height)
              size = (max(1, int(crop.width*scale)), max(1, int(crop.height*scale)))
              resized = crop.resize(size, Image.Resampling.NEAREST)
              out = Image.new('RGB', (width,height), 'black')
              out.paste(resized, ((width-size[0])//2, (height-size[1])//2))
              return out

          # phases.png — exact boundary frames, with compact two-line labels.
          phase_items = [
              (0,  'BẮT ĐẦU', ('f0–f8: nửa bước 1', 'một chân nâng/đưa trước')),
              (8,  'KẾT THÚC', ('f0–f8: nửa bước 1', 'một chân nâng/đưa trước')),
              (9,  'BẮT ĐẦU', ('f9–f16: chân đó hạ', 'qua mốc nửa chu kỳ')),
              (16, 'KẾT THÚC', ('f9–f16: chân đó hạ', 'qua mốc nửa chu kỳ')),
              (17, 'BẮT ĐẦU', ('f17–f24: nửa bước 2', 'chân đối diện nâng/đưa trước')),
              (24, 'KẾT THÚC', ('f17–f24: nửa bước 2', 'chân đối diện nâng/đưa trước')),
              (25, 'BẮT ĐẦU', ('f25–f31: chân đối diện hạ', 'pose khép về f0')),
              (31, 'KẾT THÚC', ('f25–f31: chân đối diện hạ', 'pose khép về f0')),
          ]
          W, margin, gap, header = 1760, 20, 16, 100
          cell_w = (W - 2*margin - 3*gap)//4
          panel_h, label_h = 390, 82
          row_h = 34 + panel_h + label_h
          H = header + 2*row_h + gap + 16
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Ranh giới phase — walking-3', font=title_font, fill='black')
          draw.text((20,56), 'Chỉ hiển thị đúng frame bắt đầu/kết thúc dùng để xác định bốn phase.', font=subtitle_font, fill='black')
          for idx,(frame_id,kind,lines) in enumerate(phase_items):
              row,col = divmod(idx,4)
              x = margin + col*(cell_w+gap)
              y = header + row*(row_h+gap)
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              ly = y+34+panel_h+6
              draw.text((x+4,ly), kind, font=label_bold, fill='black')
              draw.text((x+4,ly+20), lines[0], font=label_font, fill='black')
              draw.text((x+4,ly+40), lines[1], font=label_font, fill='black')
          canvas.save(root / 'phases.png', optimize=True)

          # key-poses.png — concise two-line roles, no text spill between cells.
          key_items = [
              (0,  ('đầu loop', 'pose trung gian hai nửa bước')),
              (8,  ('swing 1 rõ', 'chân nâng + tay đối bên')),
              (17, ('mốc nửa chu kỳ', 'Hips Z cao nhất')),
              (24, ('swing đối diện rõ', 'chân nâng + tay đối bên')),
              (31, ('khép loop', 'preview trùng f0')),
          ]
          W, margin, gap, header = 1750, 20, 18, 100
          cell_w = (W - 2*margin - 4*gap)//5
          panel_h = 455
          label_h = 66
          H = header + 34 + panel_h + label_h + 16
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Key poses — walking-3', font=title_font, fill='black')
          draw.text((20,56), 'Các pose đại diện cho hai nửa bước và điểm đóng loop.', font=subtitle_font, fill='black')
          for idx,(frame_id,lines) in enumerate(key_items):
              x = margin + idx*(cell_w+gap)
              y = header
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              ly = y+34+panel_h+7
              draw.text((x+4,ly), lines[0], font=label_bold, fill='black')
              draw.text((x+4,ly+22), lines[1], font=label_font, fill='black')
          canvas.save(root / 'key-poses.png', optimize=True)
          PY

      - name: Verify trusted source and metadata gate
        run: |
          set -euo pipefail
          git diff --exit-code -- sample/humanoid_motion/mixamo/walking-3/animation.json
          git diff --exit-code -- sample/humanoid_motion/mixamo/walking-3/preview.gif
          test ! -e sample/humanoid_motion/mixamo/walking-3/metadata.json

      - name: Upload complete evidence set for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: walking-3-evidence-fixed
          path: |
            sample/humanoid_motion/mixamo/walking-3/phases.png
            sample/humanoid_motion/mixamo/walking-3/key-poses.png
            sample/humanoid_motion/mixamo/walking-3/weight-transfer.png
            sample/humanoid_motion/mixamo/walking-3/body-mechanics.png
          if-no-files-found: error
          retention-days: 2

      - name: Commit fixed evidence
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sample/humanoid_motion/mixamo/walking-3/phases.png \
            sample/humanoid_motion/mixamo/walking-3/key-poses.png
          git commit -m 'docs: fix walking-3 evidence layout'
          git push origin HEAD:"$HEAD_BRANCH"
