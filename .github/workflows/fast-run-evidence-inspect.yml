name: Fast Run Evidence Source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fast-run-evidence-inspect.yml'
      - 'sample/humanoid_motion/mixamo/fast-run/**'

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Package trusted source
        run: |
          set -euo pipefail
          mkdir -p build/fast-run-source
          cp sample/humanoid_motion/mixamo/fast-run/animation.json build/fast-run-source/
          cp sample/humanoid_motion/mixamo/fast-run/preview.gif build/fast-run-source/
          git rev-parse HEAD > build/fast-run-source/source-sha.txt
      - name: Upload trusted source artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-run-source
          path: build/fast-run-source/
          retention-days: 1
