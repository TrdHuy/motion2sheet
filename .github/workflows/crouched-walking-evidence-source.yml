name: Crouched Walking Evidence Source

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/crouched-walking-evidence-source.yml'

permissions:
  contents: write

jobs:
  generate-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install evidence tooling
        run: python -m pip install pillow matplotlib

      - name: Generate evidence from trusted source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          import matplotlib.pyplot as plt
          from PIL import Image, ImageDraw, ImageFont

          root = Path('sample/humanoid_motion/mixamo/crouched-walking')
          animation = json.loads((root / 'animation.json').read_text())
          assert animation['frameCount'] == 32
          assert animation['fps'] == 30.0
          assert animation['loop'] is True
          assert animation['quaternionConvention']['componentOrder'] == 'wxyz'
          assert animation['coordinateSystem']['rightAxis'] == '+X'

          gif = Image.open(root / 'preview.gif')
          frames = []
          for frame_id in range(animation['frameCount']):
              gif.seek(frame_id)
              frames.append(gif.convert('RGB').copy())

          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          title_font = ImageFont.truetype(bold, 38)
          subtitle_font = ImageFont.truetype(regular, 22)
          frame_font = ImageFont.truetype(bold, 28)
          label_font = ImageFont.truetype(regular, 17)
          label_bold = ImageFont.truetype(bold, 17)

          # Constant crop keeps the same screen-space reference across selected frames.
          crop_box = (72, 70, 160, 214)
          def panel(frame_id, width, height):
              crop = frames[frame_id].crop(crop_box)
              scale = min(width / crop.width, height / crop.height)
              size = (max(1, int(crop.width * scale)), max(1, int(crop.height * scale)))
              resized = crop.resize(size, Image.Resampling.NEAREST)
              out = Image.new('RGB', (width, height), 'black')
              out.paste(resized, ((width-size[0])//2, (height-size[1])//2))
              return out

          # phases.png — exact start/end frames used by the review text.
          W, margin, gap, header = 1800, 18, 16, 92
          cell_w = (W - 2*margin - 3*gap)//4
          panel_h, label_h = 390, 58
          row_h = 36 + panel_h + label_h
          H = header + 2*row_h + gap + 12
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((18,14), 'Phase boundaries — crouched-walking', font=title_font, fill='black')
          draw.text((18,58), 'Only exact boundary frames are shown. Source frames: preview.gif; frame IDs: animation.json.', font=subtitle_font, fill='black')
          phase_items = [
              (0, 'START', 'leg A swing → placement', None),
              (7, 'END',   'leg A swing → placement', None),
              (8, 'START', 'leg B lift → swing-through', None),
              (15,'END',   'leg B lift → swing-through', None),
              (16,'START', 'leg B swing → placement', None),
              (23,'END',   'leg B swing → placement', None),
              (24,'START', 'leg A lift → swing-through', 'to loop seam'),
              (31,'END',   'leg A lift → swing-through', 'to loop seam'),
          ]
          for idx,(frame_id,kind,desc,extra) in enumerate(phase_items):
              row,col = divmod(idx,4)
              x = margin + col*(cell_w+gap)
              y = header + row*(row_h+gap)
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+36))
              label_y = y+36+panel_h+4
              draw.text((x+4,label_y), f'{kind}: {desc}', font=label_font, fill='black')
              if extra:
                  draw.text((x+4,label_y+21), extra, font=label_font, fill='black')
          canvas.save(root / 'phases.png', optimize=True)

          # key-poses.png — only four distinct gait poses.
          W, margin, gap, header = 1760, 24, 24, 100
          cell_w = (W - 2*margin - 3*gap)//4
          panel_h = 560
          H = header + 36 + panel_h + 58 + 16
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((24,14), 'Key poses — crouched-walking', font=title_font, fill='black')
          draw.text((24,58), 'Only distinct gait poses supported by the rendered source are shown.', font=subtitle_font, fill='black')
          key_items = [(4,'leg A placement'), (12,'leg B swing'), (20,'leg B placement'), (28,'leg A swing')]
          for idx,(frame_id,role) in enumerate(key_items):
              x = margin + idx*(cell_w+gap)
              y = header
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+36))
              draw.text((x+4,y+36+panel_h+8), role, font=label_bold, fill='black')
          canvas.save(root / 'key-poses.png', optimize=True)

          # weight-transfer.png — screen evidence plus the hips +X translation channel.
          hips_x = [float(v[0]) for v in animation['hips']['translations']]
          selected = [0,8,16,24,31]
          fig = plt.figure(figsize=(18,10.46), dpi=100)
          fig.text(0.012,0.972,'Weight transfer — crouched-walking',fontsize=25,fontweight='bold',va='top')
          fig.text(0.012,0.94,'Pelvis shifts toward +X/right through mid-cycle, then returns; support-leg identity is intentionally not annotated.',fontsize=15,va='top')
          for i,frame_id in enumerate(selected):
              ax = fig.add_axes([0.01+i*0.194,0.52,0.186,0.36])
              ax.imshow(frames[frame_id])
              ax.set_axis_off()
              ax.set_title(f'f{frame_id}',loc='left',fontsize=18,fontweight='bold')
              ax.text(0.01,-0.06,f'hips.x = {hips_x[frame_id]:.3f}',transform=ax.transAxes,fontsize=13,fontweight='bold')
          ax = fig.add_axes([0.10,0.10,0.84,0.31])
          x = list(range(animation['frameCount']))
          ax.plot(x,hips_x,label='hips.x (+X = character right)')
          ax.set_title('animation.json: lateral pelvis transfer',fontsize=16)
          ax.set_xlabel('frame'); ax.set_ylabel('hips translation X'); ax.grid(True,alpha=.25); ax.legend(loc='upper right')
          for frame_id in selected:
              ax.scatter([frame_id],[hips_x[frame_id]])
              offset = (-4,9) if frame_id == 16 else (0,8)
              ax.annotate(f'f{frame_id}\n{hips_x[frame_id]:.3f}',(frame_id,hips_x[frame_id]),xytext=offset,textcoords='offset points',ha='center',fontsize=10)
          fig.savefig(root / 'weight-transfer.png',bbox_inches='tight')
          plt.close(fig)

          # body-mechanics.png — source frames plus opposed root/chest yaw deltas.
          def yaw_deg(q):
              w,x,y,z = [float(v) for v in q]
              return math.degrees(math.atan2(2*(w*z+x*y), 1-2*(y*y+z*z)))
          root_yaw = [yaw_deg(q) for q in animation['root']['rotations']]
          chest_yaw = [yaw_deg(q) for q in animation['joints']['Chest']['rotations']]
          root_delta = [v-root_yaw[0] for v in root_yaw]
          chest_delta = [v-chest_yaw[0] for v in chest_yaw]
          selected = [4,12,20,28]
          fig = plt.figure(figsize=(18,11.7), dpi=100)
          fig.text(0.012,0.977,'Body mechanics — crouched-walking',fontsize=25,fontweight='bold',va='top')
          fig.text(0.012,0.948,'Persistent knee/hip flexion + forward torso; compact low arms accompany opposed root/chest yaw changes.',fontsize=15,va='top')
          fig.text(0.012,0.925,'Yaw is derived from animation.json wxyz quaternion channels; deltas are relative to f0.',fontsize=12,va='top')
          for i,frame_id in enumerate(selected):
              ax = fig.add_axes([0.01+i*0.245,0.51,0.235,0.37])
              ax.imshow(frames[frame_id]); ax.set_axis_off(); ax.set_title(f'f{frame_id}',loc='left',fontsize=18,fontweight='bold')
              ax.text(0.01,-0.06,f'root Δyaw {root_delta[frame_id]:+.1f}°\nChest Δyaw {chest_delta[frame_id]:+.1f}°',transform=ax.transAxes,fontsize=12,fontweight='bold')
          ax = fig.add_axes([0.11,0.09,0.80,0.30])
          x = list(range(animation['frameCount']))
          ax.plot(x,root_delta,label='root yaw Δ from f0')
          ax.plot(x,chest_delta,label='Chest local yaw Δ from f0')
          for frame_id in selected:
              ax.axvline(frame_id,linestyle='--',alpha=.25)
          ax.axhline(0,linewidth=.8)
          ax.set_title('animation.json: opposed root/chest yaw changes support counter-rotation',fontsize=16)
          ax.set_xlabel('frame'); ax.set_ylabel('Δ yaw (degrees)'); ax.grid(True,alpha=.25); ax.legend(loc='upper right')
          fig.savefig(root / 'body-mechanics.png',bbox_inches='tight')
          plt.close(fig)
          PY

      - name: Verify trusted source is untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- sample/humanoid_motion/mixamo/crouched-walking/animation.json
          git diff --exit-code -- sample/humanoid_motion/mixamo/crouched-walking/preview.gif
          test ! -e sample/humanoid_motion/mixamo/crouched-walking/metadata.json

      - name: Commit evidence on PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sample/humanoid_motion/mixamo/crouched-walking/phases.png \
            sample/humanoid_motion/mixamo/crouched-walking/key-poses.png \
            sample/humanoid_motion/mixamo/crouched-walking/weight-transfer.png \
            sample/humanoid_motion/mixamo/crouched-walking/body-mechanics.png
          git commit -m 'docs: add crouched-walking metadata evidence'
          git push origin HEAD:"$HEAD_BRANCH"
