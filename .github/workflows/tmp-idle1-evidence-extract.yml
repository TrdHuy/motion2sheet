name: tmp idle-1 source export

on:
  push:
    branches:
      - metadata-evidence/mixamo-idle-1

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact trusted sources
        shell: bash
        run: |
          mkdir -p /tmp/idle1-source
          cp sample/humanoid_motion/mixamo/idle-1/animation.json /tmp/idle1-source/animation.json
          cp sample/humanoid_motion/mixamo/idle-1/preview.gif /tmp/idle1-source/preview.gif
          sha256sum /tmp/idle1-source/animation.json /tmp/idle1-source/preview.gif > /tmp/idle1-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: idle1-trusted-source
          path: /tmp/idle1-source
          if-no-files-found: error
          retention-days: 1
