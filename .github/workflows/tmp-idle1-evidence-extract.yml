name: tmp idle-1 evidence extract

on:
  push:
    branches:
      - metadata-evidence/mixamo-idle-1

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Extract source-frame evidence candidates
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageSequence

          src = Path('sample/humanoid_motion/mixamo/idle-1')
          out = Path('/tmp/idle1-inspect')
          frames_dir = out / 'frames'
          frames_dir.mkdir(parents=True, exist_ok=True)

          data = json.loads((src / 'animation.json').read_text())
          frame_count = int(data['frameCount'])
          fps = float(data['fps'])

          gif = Image.open(src / 'preview.gif')
          gif_frames = []
          gif_durations = []
          for fr in ImageSequence.Iterator(gif):
              gif_frames.append(fr.convert('RGBA').copy())
              gif_durations.append(int(fr.info.get('duration', gif.info.get('duration', 100))))
          if not gif_frames:
              raise RuntimeError('preview.gif has no frames')
          if any(d <= 0 for d in gif_durations):
              fallback = max(1, round(1000 / fps))
              gif_durations = [d if d > 0 else fallback for d in gif_durations]

          cumulative = []
          total = 0
          for d in gif_durations:
              total += d
              cumulative.append(total)

          def gif_index_for_time(ms):
              for i, end in enumerate(cumulative):
                  if ms < end:
                      return i
              return len(cumulative) - 1

          mapping = []
          for f in range(frame_count):
              t_ms = 1000.0 * f / fps
              gi = gif_index_for_time(t_ms)
              mapping.append(gi)
              gif_frames[gi].save(frames_dir / f'f{f:02d}.png')

          # Contact sheet: every canonical animation frame, sampled from preview.gif by time.
          cell_w, cell_h = 168, 190
          cols = 10
          rows = math.ceil(frame_count / cols)
          sheet = Image.new('RGB', (cols * cell_w, rows * cell_h), 'white')
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()
          for f in range(frame_count):
              im = Image.open(frames_dir / f'f{f:02d}.png').convert('RGB')
              im.thumbnail((160, 160))
              x = (f % cols) * cell_w + (cell_w - im.width)//2
              y = (f // cols) * cell_h + 2
              sheet.paste(im, (x, y))
              draw.text(((f % cols)*cell_w + 4, (f//cols)*cell_h + 165), f'f{f}  gif#{mapping[f]}', fill='black', font=font)
          sheet.save(out / 'all-frames.png')

          def q_angle_deg(a, b):
              # Rotation delta; q and -q are equivalent.
              dot = abs(sum(float(x)*float(y) for x,y in zip(a,b)))
              dot = min(1.0, max(-1.0, dot))
              return math.degrees(2.0 * math.acos(dot))

          channels = {}
          for name, obj in data.items():
              if not isinstance(obj, dict):
                  continue
              entry = {}
              pos = obj.get('positions')
              if isinstance(pos, list) and len(pos) == frame_count and pos and isinstance(pos[0], list):
                  dims = len(pos[0])
                  ranges = []
                  extrema = []
                  for j in range(dims):
                      vals = [float(p[j]) for p in pos]
                      imin = min(range(frame_count), key=lambda i: vals[i])
                      imax = max(range(frame_count), key=lambda i: vals[i])
                      ranges.append(max(vals)-min(vals))
                      extrema.append({'axis': j, 'minFrame': imin, 'min': vals[imin], 'maxFrame': imax, 'max': vals[imax]})
                  step = [0.0]
                  for i in range(1, frame_count):
                      step.append(math.sqrt(sum((float(pos[i][j])-float(pos[i-1][j]))**2 for j in range(dims))))
                  entry['positions'] = {'ranges': ranges, 'extrema': extrema, 'stepMagnitude': step}
              rot = obj.get('rotations')
              if isinstance(rot, list) and len(rot) == frame_count and rot and isinstance(rot[0], list) and len(rot[0]) == 4:
                  rel0 = [q_angle_deg(rot[0], q) for q in rot]
                  step = [0.0] + [q_angle_deg(rot[i-1], rot[i]) for i in range(1, frame_count)]
                  entry['rotations'] = {
                      'angleFromF0Deg': rel0,
                      'stepAngleDeg': step,
                      'maxFromF0Frame': max(range(frame_count), key=lambda i: rel0[i]),
                      'maxFromF0Deg': max(rel0),
                      'maxStepFrame': max(range(frame_count), key=lambda i: step[i]),
                      'maxStepDeg': max(step),
                  }
              if entry:
                  channels[name] = entry

          inspect = {
              'animation': {'frameCount': frame_count, 'fps': fps, 'duration': data.get('duration'), 'loop': data.get('loop')},
              'preview': {'gifFrameCount': len(gif_frames), 'gifDurationMs': total, 'durationsMs': gif_durations, 'animationFrameToGifFrame': mapping},
              'topLevelKeys': list(data.keys()),
              'channels': channels,
          }
          (out / 'inspect.json').write_text(json.dumps(inspect, indent=2) + '\n')

          with (out / 'mapping.csv').open('w', newline='') as fp:
              w = csv.writer(fp)
              w.writerow(['animation_frame','time_ms','gif_frame'])
              for f, gi in enumerate(mapping):
                  w.writerow([f, round(1000*f/fps, 3), gi])
          print(json.dumps({'frameCount': frame_count, 'fps': fps, 'gifFrameCount': len(gif_frames), 'gifDurationMs': total}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: idle1-source-inspection
          path: /tmp/idle1-inspect
          if-no-files-found: error
          retention-days: 1
