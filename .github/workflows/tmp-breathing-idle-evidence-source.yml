name: tmp breathing idle evidence source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  package-source:
    if: github.head_ref == 'metadata-evidence/breathing-idle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: breathing-idle-review-source
          path: |
            sample/humanoid_motion/mixamo/breathing-idle/animation.json
            sample/humanoid_motion/mixamo/breathing-idle/preview.gif
          if-no-files-found: error
          retention-days: 1
