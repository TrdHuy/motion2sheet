name: Humanoid Motion

on:
  pull_request:
    types: [opened, synchronize, reopened, assigned]
    paths:
      - '.github/workflows/humanoid-motion.yml'
      - 'tools/dual_weapon_combo_evidence_temp.py'

permissions:
  contents: write

concurrency:
  group: humanoid-motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dual-weapon-combo-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'metadata/dual-weapon-combo-evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10.4,<12'
      - name: Verify trusted dual-weapon-combo source
        shell: bash
        run: |
          set -euo pipefail
          DIR='sample/humanoid_motion/mixamo/dual-weapon-combo'
          printf '%s  %s\n' 'ba576f777943f27f60c040c65a0236e98c436296ee183dc47fdb68514d11d69d' "$DIR/animation.json" | sha256sum -c -
          printf '%s  %s\n' '7eede06e68a9ae61f29f4368accce9d326068228eef6b01666c82c11490cf883' "$DIR/preview.gif" | sha256sum -c -
      - name: Generate four review evidence images
        run: python tools/dual_weapon_combo_evidence_temp.py
      - name: Keep only review evidence in final diff
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          DIR='sample/humanoid_motion/mixamo/dual-weapon-combo'
          git fetch origin "$BASE"
          git checkout "origin/$BASE" -- .github/workflows/humanoid-motion.yml
          git rm -f .github/workflows/dual-weapon-combo-evidence-temp.yml tools/dual_weapon_combo_evidence_temp.py
          git add "$DIR/phases.png" "$DIR/key-poses.png" "$DIR/weight-transfer.png" "$DIR/body-mechanics.png" .github/workflows/humanoid-motion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add dual-weapon-combo metadata review evidence'
          git push origin "HEAD:$BRANCH"
