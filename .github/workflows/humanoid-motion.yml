name: Humanoid Motion

on:
  pull_request:
    paths:
      - 'motion2sheet/motion/humanoid_motion/**'
      - 'motion2sheet/motion/roundtrip/**'
      - 'motion2sheet/motion/model_render/**'
      - 'motion2sheet/motion/skin/**'
      - 'profiles/humanoid_motion/**'
      - 'profiles/cameras/front_humanoid_motion.json5'
      - 'tests/motion/humanoid_motion/**'
      - 'tests/motion/roundtrip/test_contract.py'
      - '.github/workflows/humanoid-motion.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Humanoid Motion acceptance mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: humanoid-motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  humanoid-motion:
    name: humanoid-motion / ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
      ROOT: build/motion/humanoid-motion
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Humanoid and shared unit tests
        run: bash tests/motion/humanoid_motion/ci/run_unit.sh
      - name: Run native timing regressions
        run: bash tests/motion/humanoid_motion/ci/run_timing.sh
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version
      - name: Run Humanoid Motion acceptance
        run: |
          set -euo pipefail
          if [[ "$MODE" == "full" ]]; then
            bash tests/motion/humanoid_motion/ci/run_full.sh "$ROOT"
          else
            bash tests/motion/humanoid_motion/ci/run_smoke.sh "$ROOT"
          fi
      - name: Upload consolidated Humanoid Motion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-motion-pr13-proof
          path: build/motion/humanoid-motion/
          if-no-files-found: warn
          retention-days: 7
