name: Walking 3 Evidence Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/walking-3-analysis.yml'
      - 'sample/humanoid_motion/mixamo/walking-3/**'

permissions:
  contents: write

jobs:
  generate-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install evidence tooling
        run: python -m pip install pillow

      - name: Generate evidence from trusted source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('sample/humanoid_motion/mixamo/walking-3')
          animation = json.loads((root / 'animation.json').read_text())
          assert animation['id'] == 'walking-3'
          assert animation['frameCount'] == 32
          assert animation['fps'] == 30.0
          assert math.isclose(animation['durationSeconds'], 31/30, rel_tol=0, abs_tol=1e-12)
          assert animation.get('loop') is True
          assert animation['coordinateSystem']['rightAxis'] == '+X'
          assert animation['coordinateSystem']['upAxis'] == '+Z'
          assert animation['quaternionConvention']['componentOrder'] == 'wxyz'

          gif = Image.open(root / 'preview.gif')
          assert getattr(gif, 'n_frames', 1) == animation['frameCount']
          frames = []
          for frame_id in range(animation['frameCount']):
              gif.seek(frame_id)
              frames.append(gif.convert('RGB').copy())

          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          title_font = ImageFont.truetype(bold, 32)
          subtitle_font = ImageFont.truetype(regular, 18)
          frame_font = ImageFont.truetype(bold, 24)
          label_font = ImageFont.truetype(regular, 15)
          label_bold = ImageFont.truetype(bold, 15)
          small_font = ImageFont.truetype(regular, 13)

          crop_box = (45, 42, 180, 220)
          def panel(frame_id, width, height):
              crop = frames[frame_id].crop(crop_box)
              scale = min(width / crop.width, height / crop.height)
              size = (max(1, int(crop.width * scale)), max(1, int(crop.height * scale)))
              resized = crop.resize(size, Image.Resampling.NEAREST)
              out = Image.new('RGB', (width, height), 'black')
              out.paste(resized, ((width-size[0])//2, (height-size[1])//2))
              return out

          # phases.png — exactly the frames used as phase boundaries.
          phase_items = [
              (0,  'BẮT ĐẦU', 'f0–f8: nửa bước 1 — một chân nâng/đưa trước'),
              (8,  'KẾT THÚC', 'f0–f8: nửa bước 1 — một chân nâng/đưa trước'),
              (9,  'BẮT ĐẦU', 'f9–f16: chân đó hạ dần; cơ thể qua nửa chu kỳ'),
              (16, 'KẾT THÚC', 'f9–f16: chân đó hạ dần; cơ thể qua nửa chu kỳ'),
              (17, 'BẮT ĐẦU', 'f17–f24: nửa bước 2 — chân đối diện nâng/đưa trước'),
              (24, 'KẾT THÚC', 'f17–f24: nửa bước 2 — chân đối diện nâng/đưa trước'),
              (25, 'BẮT ĐẦU', 'f25–f31: chân đối diện hạ; pose khép về f0'),
              (31, 'KẾT THÚC', 'f25–f31: chân đối diện hạ; pose khép về f0'),
          ]
          W, margin, gap, header = 1760, 20, 16, 100
          cell_w = (W - 2*margin - 3*gap)//4
          panel_h, label_h = 390, 66
          row_h = 34 + panel_h + label_h
          H = header + 2*row_h + gap + 16
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Ranh giới phase — walking-3', font=title_font, fill='black')
          draw.text((20,56), 'Chỉ hiển thị đúng frame bắt đầu/kết thúc được dùng để xác định bốn phase.', font=subtitle_font, fill='black')
          for idx,(frame_id,kind,desc) in enumerate(phase_items):
              row,col = divmod(idx,4)
              x = margin + col*(cell_w+gap)
              y = header + row*(row_h+gap)
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              ly = y+34+panel_h+5
              draw.text((x+4,ly), f'{kind}: {desc}', font=label_font, fill='black')
          canvas.save(root / 'phases.png', optimize=True)

          # key-poses.png — only poses with distinct review meaning.
          key_items = [
              (0,  'Mốc đầu loop; pose trung gian giữa hai nửa bước'),
              (8,  'Swing 1 rõ: một bàn chân nâng; tay đối bên đưa trước'),
              (17, 'Mốc nửa chu kỳ; Hips Z cao nhất'),
              (24, 'Swing đối diện rõ; tay đối bên đưa trước'),
              (31, 'Khép loop: preview trùng f0; pose trở về đầu'),
          ]
          W, margin, gap, header = 1750, 20, 18, 100
          cell_w = (W - 2*margin - 4*gap)//5
          panel_h = 455
          H = header + 34 + panel_h + 76
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Key poses — walking-3', font=title_font, fill='black')
          draw.text((20,56), 'Các pose đại diện cho hai nửa bước đối xứng và điểm đóng loop.', font=subtitle_font, fill='black')
          for idx,(frame_id,role) in enumerate(key_items):
              x = margin + idx*(cell_w+gap)
              y = header
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              draw.text((x+4,y+34+panel_h+8), role, font=label_bold, fill='black')
          canvas.save(root / 'key-poses.png', optimize=True)

          hips = [[float(v) for v in p] for p in animation['hips']['translations']]
          xs = [p[0] for p in hips]
          zs = [p[2] for p in hips]
          assert min(range(len(xs)), key=xs.__getitem__) == 4
          assert max(range(len(xs)), key=xs.__getitem__) == 20
          assert max(range(len(zs)), key=zs.__getitem__) == 17
          assert min(range(len(zs)), key=zs.__getitem__) == 25
          assert zs[10] < zs[9] and zs[10] < zs[11]
          assert math.dist(hips[0], hips[31]) < 1e-5

          # weight-transfer.png — pelvis path only; no unsupported support-foot label.
          selected = [4,10,17,20,25,31]
          roles = {
              4:  'Hips X nhỏ nhất',
              10: 'pelvis thấp cục bộ lần 1',
              17: 'Hips Z cao nhất',
              20: 'Hips X lớn nhất',
              25: 'Hips Z thấp nhất',
              31: 'recenter / khép loop',
          }
          W, margin, gap, header = 1920, 20, 18, 128
          cell_w = (W - 2*margin - 5*gap)//6
          panel_h = 380
          info_h = 72
          graph_h = 360
          H = header + 34 + panel_h + info_h + graph_h + 52
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Chuyển trọng lượng — walking-3', font=title_font, fill='black')
          draw.text((20,56), 'Pelvis dịch -X → +X → recenter; đồng thời nhún dọc với hai vùng thấp quanh f10 và f25.', font=subtitle_font, fill='black')
          draw.text((20,84), 'Hips translation lấy trực tiếp từ animation.json; không gán chân trụ vì không có contact/force data.', font=small_font, fill='black')
          for idx,frame_id in enumerate(selected):
              x = margin + idx*(cell_w+gap)
              y = header
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              ly = y+34+panel_h+6
              draw.text((x+4,ly), roles[frame_id], font=label_bold, fill='black')
              draw.text((x+4,ly+24), f'Hips X/Z {hips[frame_id][0]:+.4f}/{hips[frame_id][2]:+.4f}', font=small_font, fill='black')

          gx0, gx1 = 90, W-40
          top1, bot1 = header+34+panel_h+info_h+15, header+34+panel_h+info_h+145
          top2, bot2 = top1+175, top1+305
          def xmap(f): return gx0 + (gx1-gx0)*f/(len(xs)-1)
          def ymap(v, vals, top, bot):
              lo, hi = min(vals), max(vals)
              if math.isclose(lo, hi): return (top+bot)/2
              return bot - (v-lo)/(hi-lo)*(bot-top)
          draw.text((20,top1-28),'Hips X theo frame',font=label_bold,fill='black')
          draw.line((gx0,bot1,gx1,bot1),fill='gray',width=1)
          pts=[(xmap(i),ymap(v,xs,top1,bot1)) for i,v in enumerate(xs)]
          draw.line(pts,fill='black',width=4)
          draw.text((20,top2-28),'Hips Z theo frame (+Z = lên)',font=label_bold,fill='black')
          draw.line((gx0,bot2,gx1,bot2),fill='gray',width=1)
          pts=[(xmap(i),ymap(v,zs,top2,bot2)) for i,v in enumerate(zs)]
          draw.line(pts,fill='black',width=4)
          for f in selected:
              px=xmap(f)
              draw.line((px,top1,px,bot2),fill='lightgray',width=1)
              draw.text((px+3,bot2-18),f'f{f}',font=small_font,fill='black')
          canvas.save(root / 'weight-transfer.png', optimize=True)

          def q_angle_deg(a, b):
              dot = abs(sum(float(x)*float(y) for x,y in zip(a,b)))
              dot = max(-1.0, min(1.0, dot))
              return math.degrees(2.0 * math.acos(dot))
          def step_series(names):
              names=[n for n in names if n in animation['joints']]
              out=[0.0]*animation['frameCount']
              for name in names:
                  seq=animation['joints'][name]['rotations']
                  for i in range(1,len(seq)):
                      out[i]+=q_angle_deg(seq[i-1],seq[i])
              return out

          torso_step = step_series(['Spine','Chest','UpperChest','Neck','Head'])
          left_arm_step = step_series(['LeftShoulder','LeftUpperArm','LeftLowerArm','LeftHand'])
          right_arm_step = step_series(['RightShoulder','RightUpperArm','RightLowerArm','RightHand'])
          left_leg_step = step_series(['LeftUpperLeg','LeftLowerLeg','LeftFoot','LeftToe'])
          right_leg_step = step_series(['RightUpperLeg','RightLowerLeg','RightFoot','RightToe'])

          # body-mechanics.png — frame sequence + motion activity, not a causal power-chain claim.
          selected = [0,8,10,17,24,25,31]
          roles = {
              0:'đầu loop',
              8:'swing 1 + tay đối bên',
              10:'pelvis thấp lần 1',
              17:'nửa chu kỳ / pelvis cao',
              24:'swing đối diện + tay đối bên',
              25:'pelvis thấp lần 2',
              31:'khép loop về f0',
          }
          W, margin, gap, header = 1960, 20, 14, 126
          cell_w = (W - 2*margin - 6*gap)//7
          panel_h = 355
          info_h = 118
          graph_h = 320
          H = header + 34 + panel_h + info_h + graph_h + 48
          canvas = Image.new('RGB', (W,H), 'white')
          draw = ImageDraw.Draw(canvas)
          draw.text((20,14), 'Body mechanics — walking-3', font=title_font, fill='black')
          draw.text((20,56), 'Chu kỳ phối hợp: chân vung luân phiên ↔ tay đối bên; pelvis nhún/chuyển ngang; torso/head xoay nhẹ theo nhịp.', font=subtitle_font, fill='black')
          draw.text((20,84), 'Các số °/frame là tổng angular step của nhóm joint từ animation.json; dùng để đối chiếu timing, không suy thành causal power chain.', font=small_font, fill='black')
          for idx,frame_id in enumerate(selected):
              x = margin + idx*(cell_w+gap)
              y = header
              draw.text((x+8,y), f'f{frame_id}', font=frame_font, fill='black')
              canvas.paste(panel(frame_id,cell_w,panel_h),(x,y+34))
              ly = y+34+panel_h+5
              draw.text((x+4,ly), roles[frame_id], font=label_bold, fill='black')
              draw.text((x+4,ly+23), f'Torso {torso_step[frame_id]:.1f}°/f', font=small_font, fill='black')
              draw.text((x+4,ly+43), f'L/R arm {left_arm_step[frame_id]:.1f}/{right_arm_step[frame_id]:.1f}°/f', font=small_font, fill='black')
              draw.text((x+4,ly+63), f'L/R leg {left_leg_step[frame_id]:.1f}/{right_leg_step[frame_id]:.1f}°/f', font=small_font, fill='black')
              draw.text((x+4,ly+83), f'Hips X/Z {hips[frame_id][0]:+.3f}/{hips[frame_id][2]:+.3f}', font=small_font, fill='black')

          gx0, gx1 = 90, W-40
          gy0 = header+34+panel_h+info_h+20
          lane_h = 92
          series = [
              ('Tay trái / phải', left_arm_step, right_arm_step),
              ('Chân trái / phải', left_leg_step, right_leg_step),
              ('Torso', torso_step, None),
          ]
          for lane,(label,a,b) in enumerate(series):
              top=gy0+lane*lane_h
              bot=top+62
              vals=a + (b if b is not None else [])
              vmax=max(vals) or 1.0
              draw.text((20,top-18),label,font=small_font,fill='black')
              draw.line((gx0,bot,gx1,bot),fill='lightgray',width=1)
              def mapv(v): return bot-(v/vmax)*(bot-top)
              pts=[(gx0+(gx1-gx0)*i/31,mapv(v)) for i,v in enumerate(a)]
              draw.line(pts,fill='black',width=3)
              if b is not None:
                  pts2=[(gx0+(gx1-gx0)*i/31,mapv(v)) for i,v in enumerate(b)]
                  draw.line(pts2,fill='gray',width=3)
          for f in selected:
              px=gx0+(gx1-gx0)*f/31
              draw.line((px,gy0,px,gy0+3*lane_h-20),fill='lightgray',width=1)
              draw.text((px+3,gy0+3*lane_h-35),f'f{f}',font=small_font,fill='black')
          canvas.save(root / 'body-mechanics.png', optimize=True)

          # Strong loop-close evidence used only to justify the loop-close key pose.
          diff = 0
          a = frames[0].tobytes()
          b = frames[31].tobytes()
          assert a == b, 'preview f31 must be pixel-identical to f0 for this evidence'
          print('Evidence generated. f0/f31 preview pixel-identical; hips closure distance:', math.dist(hips[0], hips[31]))
          PY

      - name: Verify trusted source is untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- sample/humanoid_motion/mixamo/walking-3/animation.json
          git diff --exit-code -- sample/humanoid_motion/mixamo/walking-3/preview.gif
          test ! -e sample/humanoid_motion/mixamo/walking-3/metadata.json

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: walking-3-evidence
          path: |
            sample/humanoid_motion/mixamo/walking-3/phases.png
            sample/humanoid_motion/mixamo/walking-3/key-poses.png
            sample/humanoid_motion/mixamo/walking-3/weight-transfer.png
            sample/humanoid_motion/mixamo/walking-3/body-mechanics.png
          if-no-files-found: error
          retention-days: 2

      - name: Commit evidence to PR branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sample/humanoid_motion/mixamo/walking-3/phases.png \
            sample/humanoid_motion/mixamo/walking-3/key-poses.png \
            sample/humanoid_motion/mixamo/walking-3/weight-transfer.png \
            sample/humanoid_motion/mixamo/walking-3/body-mechanics.png
          git commit -m 'docs: add walking-3 metadata evidence'
          git push origin HEAD:"$HEAD_BRANCH"
