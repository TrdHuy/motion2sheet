name: Motion JSON Command Modes Pre-Merge Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/motion-command-modes-smoke.yml'

permissions:
  contents: read

jobs:
  command-mode:
    strategy:
      fail-fast: false
      matrix:
        mode:
          - export
          - reconstruct
          - render-pillow
          - render-blender
          - verify
    name: command / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROOT: build/motion_json_command/walk_mixamo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version

      - name: Prepare canonical JSON fixture internally
        if: matrix.mode != 'export'
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          blender --background --factory-startup --python-exit-code 1 \
            --python motion2sheet/motion/roundtrip/blender_export.py -- \
            --input sample/walk_mixamo.fbx \
            --output "$ROOT"

      - name: Public command - export-animation-json
        if: matrix.mode == 'export'
        run: |
          set -euo pipefail
          motion2sheet export-animation-json sample/walk_mixamo.fbx --output "$ROOT"
          test -f "$ROOT/rig.json"
          test -f "$ROOT/animation.json"
          test -f "$ROOT/diagnostics/original_fbx_curves.json"

      - name: Public command - reconstruct-animation
        if: matrix.mode == 'reconstruct'
        run: |
          set -euo pipefail
          motion2sheet reconstruct-animation \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --output "$ROOT/reconstructed.blend" \
            --fbx-output "$ROOT/reconstructed.fbx"
          test -f "$ROOT/reconstructed.blend"
          test -f "$ROOT/reconstructed.fbx"

      - name: Prove standalone render has no source FBX
        if: matrix.mode == 'render-pillow' || matrix.mode == 'render-blender'
        run: |
          set -euo pipefail
          rm sample/walk_mixamo.fbx
          test ! -e sample/walk_mixamo.fbx

      - name: Public command - render-animation-json Pillow
        if: matrix.mode == 'render-pillow'
        run: |
          set -euo pipefail
          motion2sheet render-animation-json \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --renderer pillow \
            --gif \
            --output "$ROOT/render-pillow"
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path('build/motion_json_command/walk_mixamo/render-pillow')
          report = json.loads((root / 'render.json').read_text())
          visual = report['visual']
          assert report['pass'] is True
          assert report['sourceMotionFileRequired'] is False
          assert report['frameCount'] == 32
          assert visual['frameCount'] == 32
          assert visual['columns'] == 8 and visual['rows'] == 4
          assert visual['canvasPerFrame'] == [256, 256]
          assert visual['layout']['occupiedCells'] == 32
          assert visual['layout']['emptyCells'] == []
          with Image.open(root / 'pose_sheet.png') as image:
              assert image.size == (2048, 1024)
          assert (root / 'preview.gif').is_file()
          PY

      - name: Public command - render-animation-json Blender
        if: matrix.mode == 'render-blender'
        run: |
          set -euo pipefail
          motion2sheet render-animation-json \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --renderer blender \
            --gif \
            --output "$ROOT/render-blender"
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path('build/motion_json_command/walk_mixamo/render-blender')
          report = json.loads((root / 'render.json').read_text())
          visual = report['visual']
          assert report['pass'] is True
          assert report['sourceMotionFileRequired'] is False
          assert report['frameCount'] == 32
          assert visual['frameCount'] == 32
          assert visual['columns'] == 8 and visual['rows'] == 4
          assert visual['canvasPerFrame'] == [256, 256]
          assert visual['layout']['occupiedCells'] == 32
          assert visual['layout']['emptyCells'] == []
          with Image.open(root / 'pose_sheet.png') as image:
              assert image.size == (2048, 1024)
          assert (root / 'preview.gif').is_file()
          PY

      - name: Prepare reconstruction fixture internally for verify
        if: matrix.mode == 'verify'
        run: |
          set -euo pipefail
          blender --background --factory-startup --python-exit-code 1 \
            --python motion2sheet/motion/roundtrip/blender_reconstruct.py -- \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --blend-output "$ROOT/reconstructed.blend" \
            --fbx-output "$ROOT/reconstructed.fbx"

      - name: Public command - verify-animation-roundtrip
        if: matrix.mode == 'verify'
        run: |
          set -euo pipefail
          motion2sheet verify-animation-roundtrip \
            --source sample/walk_mixamo.fbx \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --blend "$ROOT/reconstructed.blend" \
            --fbx "$ROOT/reconstructed.fbx" \
            --output "$ROOT"
          python tests/motion/roundtrip/e2e/verify_roundtrip.py "$ROOT"

      - name: Upload mode proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-json-${{ matrix.mode }}
          path: build/motion_json_command/
          if-no-files-found: error
          retention-days: 7
