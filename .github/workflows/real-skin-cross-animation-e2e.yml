name: Real Mixamo Cross-animation E2E

on:
  pull_request:
    paths:
      - 'motion2sheet/motion/model_render/**'
      - 'motion2sheet/motion/skin/**'
      - 'motion2sheet/motion/cli.py'
      - 'profiles/cameras/**'
      - 'tests/motion/model_render/**'
      - '.github/workflows/real-skin-cross-animation-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-animation:
    name: real-mixamo-cross-animation / one-character-many-contract-b
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_BASE: https://github.com/TrdHuy/motion2sheet/releases/download/e2e_gh_action_asset
      WALK_SHA256: 1e05bcef7c030dce1be09a38a6e3d2f38d1f9bc71396584876ab1a3141005c02
      WALK_SIZE: '41940608'
      IDLE_SHA256: 3738c0c5a1a4c33e36c30f59ea3393a4ee612eef89542157ff59963ad49a7b72
      IDLE_SIZE: '552400'
      RUN_SHA256: a0ddd67d5e72dc657a6445d06af3d17f8ba6a15e61b19224d4c63f897ac0e91b
      RUN_SIZE: '333840'
      RUN_INPLACE_SHA256: a289ced832f2fa618ee90ea9dcf7c397f29490613217c016ed7d0953c0115d08
      RUN_INPLACE_SIZE: '333840'
      ROOT: build/real_skin_cross_animation
      CAMERA: profiles/cameras/front_final.json5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Skin + real-model unit tests
        run: pytest tests/motion/skin tests/motion/model_render
      - name: Assert canonical path has no Contract A or Anim2Sheet dependency
        run: |
          set -euo pipefail
          ! grep -R "motion2sheet\.anim2sheet\|anim2sheet build\|Contract A" motion2sheet/motion/model_render
      - name: Install Blender headless runtime libraries
        run: |
          set -euo pipefail
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with: {version: '4.5.12'}
      - name: Download and verify exact real Mixamo release fixtures
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/diagnostics"
          CHARACTER_FBX="$RUNNER_TEMP/walking_mixamo_with_skin.fbx"
          IDLE_FBX="$RUNNER_TEMP/idle-without-skin.fbx"
          RUN_FBX="$RUNNER_TEMP/run-without-skin-not-inplace.fbx"
          RUN_INPLACE_FBX="$RUNNER_TEMP/run-without-skin-inplace.fbx"
          curl -fL --retry 3 --retry-delay 2 -o "$CHARACTER_FBX" "$RELEASE_BASE/walking_mixamo_with_skin.fbx"
          curl -fL --retry 3 --retry-delay 2 -o "$IDLE_FBX" "$RELEASE_BASE/idle-without-skin.fbx"
          curl -fL --retry 3 --retry-delay 2 -o "$RUN_FBX" "$RELEASE_BASE/run-without-skin-not-inplace.fbx"
          curl -fL --retry 3 --retry-delay 2 -o "$RUN_INPLACE_FBX" "$RELEASE_BASE/run-without-skin-inplace.fbx"
          echo "$WALK_SHA256  $CHARACTER_FBX" | sha256sum -c -
          echo "$IDLE_SHA256  $IDLE_FBX" | sha256sum -c -
          echo "$RUN_SHA256  $RUN_FBX" | sha256sum -c -
          echo "$RUN_INPLACE_SHA256  $RUN_INPLACE_FBX" | sha256sum -c -
          test "$(stat -c %s "$CHARACTER_FBX")" -eq "$WALK_SIZE"
          test "$(stat -c %s "$IDLE_FBX")" -eq "$IDLE_SIZE"
          test "$(stat -c %s "$RUN_FBX")" -eq "$RUN_SIZE"
          test "$(stat -c %s "$RUN_INPLACE_FBX")" -eq "$RUN_INPLACE_SIZE"
          {
            echo "CHARACTER_FBX=$CHARACTER_FBX"
            echo "IDLE_FBX=$IDLE_FBX"
            echo "RUN_FBX=$RUN_FBX"
            echo "RUN_INPLACE_FBX=$RUN_INPLACE_FBX"
          } >> "$GITHUB_ENV"
      - name: Export canonical character exactly once
        run: |
          set -euo pipefail
          motion2sheet export-character "$CHARACTER_FBX" --output "$ROOT/character"
          test -s "$ROOT/character/model.glb"
          test -s "$ROOT/character/rig.json"
          test -s "$ROOT/character/skin.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); character=root/'character'
          def sha(path):
              h=hashlib.sha256(); h.update(path.read_bytes()); return h.hexdigest()
          identity={name:sha(character/name) for name in ('model.glb','rig.json','skin.json')}
          (root/'diagnostics'/'character_identity.json').write_text(json.dumps(identity,indent=2,sort_keys=True)+'\n')
          export=json.loads((character/'diagnostics'/'export.json').read_text())
          rest=export['characterRestAuthority']
          assert rest['animationIndependent'] is True
          assert rest['animationActionRead'] is False
          assert rest['animationFrameSampled'] is False
          assert rest['firstAnimationPoseUsed'] is False
          assert rest['restEncodingSourceAnimationRead'] is False
          assert rest['restEncodingSourceAnimationSampled'] is False
          assert rest['restEncodingCarrierDefinesRest'] is False
          model=export['modelAuthority']
          assert model['containsArmatureObjects'] is False
          assert model['containsArmatureModifiers'] is False
          assert model['containsVertexGroups'] is False
          assert model['animationFrameSampled'] is False
          print(json.dumps({'characterIdentity':identity,'characterRestAuthority':rest},indent=2,sort_keys=True))
          PY
      - name: Normalize Walking, Idle and Run FBX encoding without retargeting
        run: |
          set -euo pipefail
          WALK_NORMALIZED="$RUNNER_TEMP/walking-normalized.fbx"
          IDLE_NORMALIZED="$RUNNER_TEMP/idle-normalized.fbx"
          RUN_NORMALIZED="$RUNNER_TEMP/run-normalized.fbx"
          RUN_INPLACE_NORMALIZED="$RUNNER_TEMP/run-inplace-normalized.fbx"
          blender --background --factory-startup --python-exit-code 1 --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- --input "$CHARACTER_FBX" --output "$WALK_NORMALIZED" --report "$ROOT/diagnostics/walking_normalization.json"
          blender --background --factory-startup --python-exit-code 1 --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- --input "$IDLE_FBX" --output "$IDLE_NORMALIZED" --report "$ROOT/diagnostics/idle_normalization.json"
          blender --background --factory-startup --python-exit-code 1 --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- --input "$RUN_FBX" --output "$RUN_NORMALIZED" --report "$ROOT/diagnostics/run_normalization.json"
          blender --background --factory-startup --python-exit-code 1 --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- --input "$RUN_INPLACE_FBX" --output "$RUN_INPLACE_NORMALIZED" --report "$ROOT/diagnostics/run_inplace_normalization.json"
          for path in "$WALK_NORMALIZED" "$IDLE_NORMALIZED" "$RUN_NORMALIZED" "$RUN_INPLACE_NORMALIZED"; do test -s "$path"; done
          {
            echo "WALK_NORMALIZED=$WALK_NORMALIZED"
            echo "IDLE_NORMALIZED=$IDLE_NORMALIZED"
            echo "RUN_NORMALIZED=$RUN_NORMALIZED"
            echo "RUN_INPLACE_NORMALIZED=$RUN_INPLACE_NORMALIZED"
          } >> "$GITHUB_ENV"
      - name: Export all motion through locked PR11 Contract B command
        run: |
          set -euo pipefail
          motion2sheet export-animation-json "$WALK_NORMALIZED" --output "$ROOT/walking"
          motion2sheet export-animation-json "$IDLE_NORMALIZED" --output "$ROOT/idle"
          motion2sheet export-animation-json "$RUN_NORMALIZED" --output "$ROOT/run"
          motion2sheet export-animation-json "$RUN_INPLACE_NORMALIZED" --output "$ROOT/run-inplace"
          for clip in walking idle run run-inplace; do
            test -s "$ROOT/$clip/rig.json"
            test -s "$ROOT/$clip/animation.json"
          done
      - name: Verify source-to-Contract-B normalization gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          expected={
              'walking':os.environ['WALK_SHA256'],
              'idle':os.environ['IDLE_SHA256'],
              'run':os.environ['RUN_SHA256'],
              'run_inplace':os.environ['RUN_INPLACE_SHA256'],
          }
          summary={}
          for name,sha in expected.items():
              report=json.loads((root/'diagnostics'/f'{name}_normalization.json').read_text())
              assert report['source']['sha256']==sha
              assert report['normalizationRestRebuilt'] is False
              assert report['firstAnimationPoseUsedAsRest'] is False
              assert report['animationFrameUsedAsRest'] is False
              assert report['retargeting'] is False and report['fuzzyMapping'] is False
              assert report['fidelity']['pass'] and report['lockedPr11RigCapturePass']
              level1=report['restCompatibility']
              assert level1['pass'] and level1['level']==1
              assert level1['exactBoneNames'] and level1['exactHierarchy'] and level1['coordinateConventionMatch']
              assert level1['maxRestBasisErrorDegrees'] <= level1['restBasisToleranceDegrees']
              assert level1['retargeting'] is False and level1['fuzzyMapping'] is False
              summary[name]={'fidelity':report['fidelity'],'restCompatibility':level1}
          (root/'diagnostics'/'normalization_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Delete every FBX before canonical JSON-only renders
        run: |
          set -euo pipefail
          rm -f "$CHARACTER_FBX" "$IDLE_FBX" "$RUN_FBX" "$RUN_INPLACE_FBX" "$WALK_NORMALIZED" "$IDLE_NORMALIZED" "$RUN_NORMALIZED" "$RUN_INPLACE_NORMALIZED"
          for path in "$CHARACTER_FBX" "$IDLE_FBX" "$RUN_FBX" "$RUN_INPLACE_FBX" "$WALK_NORMALIZED" "$IDLE_NORMALIZED" "$RUN_NORMALIZED" "$RUN_INPLACE_NORMALIZED"; do test ! -e "$path"; done
          echo '{"allOriginalAndNormalizedFbxDeletedBeforeRender":true}' > "$ROOT/diagnostics/fbx_deletion.json"
      - name: Render SAME character with Walking Contract B
        run: |
          set -euo pipefail
          motion2sheet render-model-animation --model "$ROOT/character/model.glb" --character-rig "$ROOT/character/rig.json" --skin "$ROOT/character/skin.json" --animation-rig "$ROOT/walking/rig.json" --animation "$ROOT/walking/animation.json" --camera-profile "$CAMERA" --sheet-columns 8 --canvas 320x320 --background transparent --gif --output "$ROOT/render-walking"
      - name: Render SAME character with independent Idle Contract B
        run: |
          set -euo pipefail
          motion2sheet render-model-animation --model "$ROOT/character/model.glb" --character-rig "$ROOT/character/rig.json" --skin "$ROOT/character/skin.json" --animation-rig "$ROOT/idle/rig.json" --animation "$ROOT/idle/animation.json" --camera-profile "$CAMERA" --sheet-columns 8 --canvas 320x320 --background transparent --gif --output "$ROOT/render-idle"
      - name: Render SAME character with independent Run Contract B
        run: |
          set -euo pipefail
          motion2sheet render-model-animation --model "$ROOT/character/model.glb" --character-rig "$ROOT/character/rig.json" --skin "$ROOT/character/skin.json" --animation-rig "$ROOT/run/rig.json" --animation "$ROOT/run/animation.json" --camera-profile "$CAMERA" --sheet-columns 8 --canvas 320x320 --background transparent --gif --output "$ROOT/render-run"
      - name: Verify one character, strict Level-1, skin, playback, visual and GIF gates
        run: |
          python - <<'PY'
          import hashlib, json, math, os
          from pathlib import Path
          from PIL import Image
          from motion2sheet.motion.model_render.root_motion import contract_root_motion, root_motion_difference
          from motion2sheet.motion.roundtrip.schema import read_json
          from motion2sheet.motion.skin import validate_level1_rig_compatibility
          root=Path(os.environ['ROOT']); character=root/'character'
          def sha(path):
              h=hashlib.sha256(); h.update(path.read_bytes()); return h.hexdigest()
          expected_identity=json.loads((root/'diagnostics'/'character_identity.json').read_text())
          actual_identity={name:sha(character/name) for name in ('model.glb','rig.json','skin.json')}
          assert actual_identity==expected_identity
          deletion=json.loads((root/'diagnostics'/'fbx_deletion.json').read_text())
          assert deletion['allOriginalAndNormalizedFbxDeletedBeforeRender'] is True
          for key in ('CHARACTER_FBX','IDLE_FBX','RUN_FBX','RUN_INPLACE_FBX','WALK_NORMALIZED','IDLE_NORMALIZED','RUN_NORMALIZED','RUN_INPLACE_NORMALIZED'):
              assert not Path(os.environ[key]).exists(), key

          clip_reports={}
          for clip in ('walking','idle','run'):
              render=json.loads((root/f'render-{clip}'/'render.json').read_text())
              level1=render['rigCompatibility']
              assert level1['pass'] and level1['level']==1
              assert level1['boneCount']==65
              assert level1['exactBoneNames'] and level1['exactHierarchy'] and level1['coordinateConventionMatch']
              assert level1['maxRestBasisErrorDegrees'] <= level1['restBasisToleranceDegrees']
              assert level1['retargeting'] is False and level1['fuzzyMapping'] is False
              model=render['modelIdentity']
              assert model['pass'] and model['sameMeshObjects'] and model['sameVertexCounts'] and model['sameVertexOrder']
              stats=render['skinStatistics']
              assert stats['unknownBoneReferences']==0 and stats['weightedVertexCount']>0 and stats['influenceCount']>0
              skin=render['skinReconstruction']
              assert skin['pass'] and skin['sameMeshObjects'] and skin['sameVertexCounts'] and skin['sameVertexOrder'] and skin['sameInfluencedBones']
              assert skin['maxWeightDelta'] <= 1e-8
              playback=render['animationFidelity']
              assert playback['pass'] and playback['leftRightIdentityPass'] and playback['fullBonePlayback']
              assert playback['maxSemanticDirectionErrorDegrees'] <= 0.001
              assert playback['maxJointBendErrorDegrees'] <= 0.001
              assert playback['maxLocalRotationErrorDegrees'] <= 0.0001
              timing=render['gifTiming']
              assert len(timing['frameDurationsMs'])==render['frameCount']
              ideal=render['frameCount']/float(render['animation']['fps'])*1000.0
              assert abs(timing['totalDurationMs']-ideal) <= 5.0
              with Image.open(root/f'render-{clip}'/'preview.gif') as image:
                  assert image.n_frames==render['frameCount']
              with Image.open(root/f'render-{clip}'/'pose_sheet.png') as image:
                  alpha=image.convert('RGBA').getchannel('A').getextrema()
                  assert alpha[0]==0 and alpha[1]>0
              for required in ('pose_sheet.png','preview.gif','source.blend','diagnostics/model_identity.json','diagnostics/skin_reconstruction.json','diagnostics/playback.json'):
                  assert (root/f'render-{clip}'/required).is_file(), (clip,required)
              clip_reports[clip]={
                  'frameCount':render['frameCount'],
                  'fps':render['animation']['fps'],
                  'level1':level1,
                  'skinMaxWeightDelta':skin['maxWeightDelta'],
                  'playback':playback,
                  'gifTiming':timing,
              }

          character_rig=read_json(character/'rig.json')
          inplace_rig=read_json(root/'run-inplace'/'rig.json')
          inplace_level1=validate_level1_rig_compatibility(inplace_rig,character_rig)
          assert inplace_level1['pass'] and inplace_level1['level']==1
          assert inplace_level1['boneCount']==65 and inplace_level1['exactBoneNames'] and inplace_level1['exactHierarchy'] and inplace_level1['coordinateConventionMatch']
          assert inplace_level1['maxRestBasisErrorDegrees'] <= inplace_level1['restBasisToleranceDegrees']
          assert inplace_level1['retargeting'] is False and inplace_level1['fuzzyMapping'] is False

          run_root=contract_root_motion(read_json(root/'run'/'rig.json'),read_json(root/'run'/'animation.json'))
          inplace_root=contract_root_motion(inplace_rig,read_json(root/'run-inplace'/'animation.json'))
          difference=root_motion_difference(run_root,inplace_root)
          assert difference['pass'], {'run':run_root,'runInPlace':inplace_root,'difference':difference}
          observed_larger='run-not-inplace' if run_root['rootDisplacement']>inplace_root['rootDisplacement'] else 'run-inplace' if inplace_root['rootDisplacement']>run_root['rootDisplacement'] else 'equal'
          root_motion={
              'runNotInPlace':run_root,
              'runInPlace':inplace_root,
              'difference':difference,
              'observedLargerRootMotionClip':observed_larger,
              'gateUsesFilenameExpectation':False,
          }
          summary={
              'characterExportCount':1,
              'characterIdentityBeforeAndAfter':{'pass':True,**actual_identity},
              'allFbxDeletedBeforeRender':True,
              'clips':clip_reports,
              'runInPlaceLevel1':inplace_level1,
              'rootMotion':root_motion,
          }
          (root/'cross-animation-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Reassert no FBX and unchanged character after all renders
        run: |
          set -euo pipefail
          for path in "$CHARACTER_FBX" "$IDLE_FBX" "$RUN_FBX" "$RUN_INPLACE_FBX" "$WALK_NORMALIZED" "$IDLE_NORMALIZED" "$RUN_NORMALIZED" "$RUN_INPLACE_NORMALIZED"; do test ! -e "$path"; done
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); character=root/'character'
          expected=json.loads((root/'diagnostics'/'character_identity.json').read_text())
          def sha(path):
              h=hashlib.sha256(); h.update(path.read_bytes()); return h.hexdigest()
          assert expected=={name:sha(character/name) for name in ('model.glb','rig.json','skin.json')}
          PY
      - name: Upload cross-animation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mixamo-cross-animation-e2e
          path: build/real_skin_cross_animation/
          if-no-files-found: warn
          retention-days: 7
