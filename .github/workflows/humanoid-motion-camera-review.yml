name: Humanoid Motion Camera Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'profiles/cameras/front_humanoid_motion.json5'
      - 'profiles/cameras/side_humanoid_motion.json5'
      - 'profiles/cameras/topdown_game_humanoid_motion.json5'
      - 'samples/humanoid_motion/animations/heavy-right-cross/**'
      - 'tests/motion/humanoid_motion/ci/run_authored_attack_camera_profiles.sh'
      - 'tests/motion/humanoid_motion/ci/verify_authored_attack_multi_character.py'
      - '.github/workflows/humanoid-motion-camera-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: humanoid-motion-camera-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  camera-profile-review:
    name: humanoid-motion / authored-attack-camera-profiles
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ROOT: build/motion/direct-authored-attack-camera-profiles
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact HEAD: $ACTUAL_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version
      - name: Render all characters across front, side, and topdown-game cameras
        run: bash tests/motion/humanoid_motion/ci/run_authored_attack_camera_profiles.sh "$ROOT"
      - name: Upload camera-profile proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-motion-heavy-right-cross-camera-profiles
          path: build/motion/direct-authored-attack-camera-profiles/
          if-no-files-found: error
          retention-days: 7
