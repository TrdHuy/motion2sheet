name: Motion JSON Round-trip POC

on:
  pull_request:
    paths:
      - 'motion2sheet/motion/**'
      - 'tests/motion/roundtrip/**'
      - 'sample/walk_mixamo.fbx'
      - '.github/workflows/motion-roundtrip.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixamo-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run round-trip contract unit tests
        run: pytest tests/motion/roundtrip
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.12'
      - name: Verify Blender
        run: blender --version
      - name: Extract canonical source-authority JSON twice
        run: |
          set -euo pipefail
          ROOT=build/motion_roundtrip/walk_mixamo
          SECOND="$RUNNER_TEMP/motion-roundtrip-second"
          motion2sheet export-animation-json sample/walk_mixamo.fbx --output "$ROOT"
          motion2sheet export-animation-json sample/walk_mixamo.fbx --output "$SECOND"
          cmp "$ROOT/rig.json" "$SECOND/rig.json"
          cmp "$ROOT/animation.json" "$SECOND/animation.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/motion_roundtrip/walk_mixamo')
          rig = json.loads((root / 'rig.json').read_text())
          animation = json.loads((root / 'animation.json').read_text())
          assert rig['restAuthority'] == 'editGeometry', 'editGeometry must be the sole rig rest authority'
          fbx = animation['sourceFormat']['fbx']
          assert 'curves' not in fbx, 'canonical animation.json must not contain FBX motion curves'
          assert (root / 'diagnostics/original_fbx_curves.json').is_file()
          print('canonical authority check PASS: editGeometry is sole rest authority; animation.frames is sole motion data')
          PY
      - name: Reconstruct from frames and encode FBX from static metadata
        run: |
          set -euo pipefail
          ROOT=build/motion_roundtrip/walk_mixamo
          motion2sheet reconstruct-animation \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --output "$ROOT/reconstructed.blend" \
            --fbx-output "$ROOT/reconstructed.fbx"
      - name: Record A/B/C transform fidelity
        run: |
          set -euo pipefail
          ROOT=build/motion_roundtrip/walk_mixamo
          blender --background --factory-startup --python-exit-code 1 \
            --python motion2sheet/motion/roundtrip/blender_ab_report.py -- \
            --source sample/walk_mixamo.fbx \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --blend "$ROOT/reconstructed.blend" \
            --generic-fbx "$ROOT/reconstructed.generic.fbx" \
            --encoded-fbx "$ROOT/reconstructed.fbx" \
            --output "$ROOT/ab_metrics.json"
      - name: Verify canonical reconstruction acceptance
        run: |
          set -euo pipefail
          ROOT=build/motion_roundtrip/walk_mixamo
          SECOND="$RUNNER_TEMP/motion-roundtrip-second"
          motion2sheet verify-animation-roundtrip \
            --source sample/walk_mixamo.fbx \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --blend "$ROOT/reconstructed.blend" \
            --fbx "$ROOT/reconstructed.fbx" \
            --determinism-rig "$SECOND/rig.json" \
            --determinism-animation "$SECOND/animation.json" \
            --output "$ROOT"
          python tests/motion/roundtrip/e2e/verify_roundtrip.py "$ROOT"
      - name: Verify optional Blender-native visual renderer
        run: |
          set -euo pipefail
          ROOT=build/motion_roundtrip/walk_mixamo
          NATIVE="$ROOT/blender_native"
          motion2sheet verify-animation-roundtrip \
            --source sample/walk_mixamo.fbx \
            --rig "$ROOT/rig.json" \
            --animation "$ROOT/animation.json" \
            --blend "$ROOT/reconstructed.blend" \
            --fbx "$ROOT/reconstructed.fbx" \
            --visual-renderer blender \
            --output "$NATIVE"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/motion_roundtrip/walk_mixamo/blender_native')
          verification = json.loads((root / 'verification.json').read_text())
          visual = verification['visual']
          assert verification['pass'] is True
          assert visual['pass'] is True
          assert visual['renderer'] == 'blender-native-eevee-skeleton-v1'
          assert visual['changedPixels'] == 0
          for name in ('source_sheet.png', 'reconstructed_sheet.png', 'diff_sheet.png', 'overlay_sheet.png'):
              assert (root / 'visual' / name).is_file(), name
          print('Blender-native visual proof PASS')
          PY
      - name: Upload round-trip proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion2sheet-mixamo-json-roundtrip
          path: build/motion_roundtrip/walk_mixamo/
          if-no-files-found: error
          retention-days: 7
