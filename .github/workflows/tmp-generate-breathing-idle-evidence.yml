name: tmp generate breathing idle evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'metadata-evidence/breathing-idle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Generate evidence PNGs
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json, math, os

          base = 'sample/humanoid_motion/mixamo/breathing-idle'
          gif_path = f'{base}/preview.gif'
          json_path = f'{base}/animation.json'
          with open(json_path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          hips = data['hips']['translations']
          im = Image.open(gif_path)
          assert im.n_frames == data['frameCount'] == 299

          try:
              title_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 34)
              label_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 24)
              text_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 20)
              small_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 17)
          except Exception:
              title_font = label_font = text_font = small_font = ImageFont.load_default()

          def frame(n, scale=2):
              im.seek(n)
              fr = im.convert('RGB')
              return fr.resize((fr.width*scale, fr.height*scale), Image.Resampling.NEAREST)

          def hip_text(n):
              x,y,z = hips[n]
              return f'pelvis X {x:+.3f} | Z {z:+.3f}'

          def sheet(filename, title, subtitle, items, cols=2):
              fw, fh = 448, 448
              card_h = 555
              margin = 44
              gap = 30
              rows = math.ceil(len(items)/cols)
              W = margin*2 + cols*fw + (cols-1)*gap
              H = 165 + rows*card_h + margin
              out = Image.new('RGB', (W,H), 'white')
              d = ImageDraw.Draw(out)
              d.text((margin,30), title, fill='black', font=title_font)
              d.text((margin,80), subtitle, fill='black', font=text_font)
              for i,(n,role,extra) in enumerate(items):
                  r,c=divmod(i,cols)
                  x=margin+c*(fw+gap); y=145+r*card_h
                  fr=frame(n,2)
                  out.paste(fr,(x,y))
                  d.text((x,y+458), f'f{n}  {role}', fill='black', font=label_font)
                  d.text((x,y+495), extra or hip_text(n), fill='black', font=small_font)
              out.save(f'{base}/{filename}', optimize=True)

          sheet(
              'phases.png',
              'breathing-idle — phase boundary evidence',
              'Exact preview frames at trajectory turning points; frame numbers come from animation.json.',
              [
                  (0,'phase start',hip_text(0)),
                  (103,'phase end',hip_text(103)),
                  (104,'phase start',hip_text(104)),
                  (172,'phase end',hip_text(172)),
                  (173,'phase start',hip_text(173)),
                  (244,'phase end',hip_text(244)),
                  (245,'phase start',hip_text(245)),
                  (298,'phase end',hip_text(298)),
              ]
          )
          sheet(
              'key-poses.png',
              'breathing-idle — key pose evidence',
              'Only loop anchor and mechanically distinct pelvis sway/height extrema are shown.',
              [
                  (0,'loop-start neutral',hip_text(0)),
                  (103,'first -X sway extreme',hip_text(103)),
                  (148,'highest pelvis in crossing',hip_text(148)),
                  (172,'+X sway extreme',hip_text(172)),
                  (244,'second -X sway extreme',hip_text(244)),
              ]
          )
          sheet(
              'weight-transfer.png',
              'breathing-idle — lateral weight-shift evidence',
              'Pelvis path: -X extreme → +X extreme → -X return → loop center. No support foot is inferred.',
              [
                  (103,'-X extreme',hip_text(103)),
                  (172,'+X extreme',hip_text(172)),
                  (244,'-X return',hip_text(244)),
                  (298,'loop center',hip_text(298)),
              ]
          )
          sheet(
              'body-mechanics.png',
              'breathing-idle — body mechanics evidence',
              'Across one cross-stance arc, pelvis/lower body rises then sinks while torso, head and relaxed arms adjust continuously.',
              [
                  (103,'low at -X extreme',hip_text(103)),
                  (130,'rising while crossing',hip_text(130)),
                  (148,'highest pelvis in crossing',hip_text(148)),
                  (172,'sink into +X extreme',hip_text(172)),
              ]
          )
          PY
      - name: Commit evidence
        run: |
          if git diff --quiet -- sample/humanoid_motion/mixamo/breathing-idle/*.png; then
            echo 'Evidence already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample/humanoid_motion/mixamo/breathing-idle/phases.png \
                  sample/humanoid_motion/mixamo/breathing-idle/key-poses.png \
                  sample/humanoid_motion/mixamo/breathing-idle/weight-transfer.png \
                  sample/humanoid_motion/mixamo/breathing-idle/body-mechanics.png
          git commit -m 'Add breathing-idle review evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
