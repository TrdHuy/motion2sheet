name: VFX Refactor Once

on:
  pull_request:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply architecture migration
        shell: bash
        run: |
          if [ -d motion2sheet/vfx ]; then
            python tools/refactor_vfx2sheet_architecture.py
          fi
          git diff --binary > refactor.patch
          tar --exclude=.git -czf refactor_snapshot.tar.gz .
      - name: Upload refactor snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vfx2sheet-refactor-snapshot
          path: |
            refactor.patch
            refactor_snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
