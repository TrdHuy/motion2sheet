name: VFX Refactor Once

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply and push architecture migration
        shell: bash
        run: |
          if [ ! -d motion2sheet/vfx ]; then
            echo "Architecture already migrated"
            exit 0
          fi
          python tools/refactor_vfx2sheet_architecture.py
          # Workflow updates require a separate permission path. Keep CI unchanged
          # in this migration commit; it is updated immediately afterwards.
          git checkout -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor vfx2sheet into extensible effect architecture'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
