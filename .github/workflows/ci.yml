name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install -e '.[dev]'

      - name: Unit tests
        run: pytest

      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "4.5"

      - name: Verify Blender
        run: blender --version

      - name: Create deterministic motion fixtures
        run: >-
          blender --background --factory-startup
          --python tests/fixtures/create_synthetic_motion.py
          -- --output build/fixtures

      - name: Build FBX pose sheets
        run: >-
          motion2sheet build build/fixtures/synthetic_walk.fbx
          --action walk
          --frames 8
          --directions down,left,right,up
          --canvas 320x320
          --output build/fbx

      - name: Validate FBX output
        run: motion2sheet validate build/fbx

      - name: Build BVH pose sheets
        run: >-
          motion2sheet build build/fixtures/synthetic_walk.bvh
          --action walk
          --frames 8
          --directions down,left,right,up
          --canvas 320x320
          --output build/bvh

      - name: Validate BVH output
        run: motion2sheet validate build/bvh

      - name: Upload generated pose sheets
        uses: actions/upload-artifact@v4
        with:
          name: motion2sheet-e2e-output
          path: |
            build/fbx/
            build/bvh/
          if-no-files-found: error
          retention-days: 7
