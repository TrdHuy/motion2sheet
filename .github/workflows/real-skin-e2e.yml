name: Real Mixamo Skin E2E

on:
  pull_request:
    paths:
      - 'motion2sheet/motion/model_render/**'
      - 'motion2sheet/motion/skin/**'
      - 'motion2sheet/motion/cli.py'
      - 'profiles/cameras/**'
      - 'tests/motion/model_render/**'
      - '.github/workflows/real-skin-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-mixamo-skin:
    name: real-mixamo-skin / contract-b-model-skin
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASSET_URL: https://github.com/TrdHuy/motion2sheet/releases/download/e2e_gh_action_asset/walking_mixamo_with_skin.fbx
      ASSET_SHA256: 1e05bcef7c030dce1be09a38a6e3d2f38d1f9bc71396584876ab1a3141005c02
      ROOT: build/real_skin_e2e
      CAMERA: profiles/cameras/front_final.json5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Skin + real-model unit tests
        run: pytest tests/motion/skin tests/motion/model_render
      - name: Assert canonical real-model path has no Contract A or Anim2Sheet dependency
        run: |
          set -euo pipefail
          ! grep -R "motion2sheet\.anim2sheet\|anim2sheet build\|Contract A" motion2sheet/motion/model_render
      - name: Install Blender headless runtime libraries
        run: |
          set -euo pipefail
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with: {version: '4.5.12'}
      - name: Download exact Mixamo With-Skin release asset
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/diagnostics"
          ASSET="$RUNNER_TEMP/walking_mixamo_with_skin.fbx"
          curl -fL --retry 3 --retry-delay 2 -o "$ASSET" "$ASSET_URL"
          echo "$ASSET_SHA256  $ASSET" | sha256sum -c -
          test "$(stat -c %s "$ASSET")" -eq 41940608
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
      - name: Export real character authority twice from original With-Skin asset
        run: |
          set -euo pipefail
          motion2sheet export-character "$ASSET" --output "$ROOT/character-a"
          motion2sheet export-character "$ASSET" --output "$ROOT/character-b"
          for name in model.glb rig.json skin.json; do
            cmp "$ROOT/character-a/$name" "$ROOT/character-b/$name"
          done
          cp -a "$ROOT/character-a" "$ROOT/character"
      - name: Normalize only numerical rest shear for locked PR 11 motion exporter
        run: |
          set -euo pipefail
          NORMALIZED="$RUNNER_TEMP/walking_mixamo_motion_normalized.fbx"
          blender --background --factory-startup --python-exit-code 1 \
            --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- \
            --input "$ASSET" \
            --output "$NORMALIZED" \
            --report "$ROOT/diagnostics/motion_source_normalization.json"
          test -s "$NORMALIZED"
          test -s "$ROOT/diagnostics/motion_source_normalization.json"
          echo "NORMALIZED=$NORMALIZED" >> "$GITHUB_ENV"
      - name: Export Contract B animation using locked PR 11 command on proven-equivalent motion copy
        run: |
          set -euo pipefail
          motion2sheet export-animation-json "$NORMALIZED" --output "$ROOT/animation"
          test -s "$ROOT/animation/rig.json"
          test -s "$ROOT/animation/animation.json"
      - name: Render original skinned source reference before deletion
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from motion2sheet.motion.model_render.profile import load_camera_profile
          from motion2sheet.motion.roundtrip.schema import read_json
          root=Path(os.environ['ROOT'])
          animation=read_json(root/'animation'/'animation.json')
          normalization=json.loads((root/'diagnostics'/'motion_source_normalization.json').read_text())
          camera=load_camera_profile(Path(os.environ['CAMERA']))
          output=root/'source-reference'
          output.mkdir(parents=True,exist_ok=True)
          contract_frames=[int(row['frame']) for row in animation['frames']]
          frame_offset=int(normalization['frameOffset'])
          assert contract_frames == list(range(int(normalization['normalized']['frameRange'][0]), int(normalization['normalized']['frameRange'][1]) + 1))
          request={
              'sourcePath': os.environ['ASSET'],
              'output': str(output.resolve()),
              'selectedFrames': contract_frames,
              'frameOffset': frame_offset,
              'canvas': [320,320],
              'background': {'transparent': True, 'rgba': [0.0,0.0,0.0,0.0]},
              'camera': camera,
          }
          (output/'request.json').write_text(json.dumps(request,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          blender --background --factory-startup --python-exit-code 1 \
            --python motion2sheet/motion/model_render/blender_source_reference.py -- \
            --request "$ROOT/source-reference/request.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from motion2sheet.motion.model_render.runner import compose_gif, compose_sheet
          from motion2sheet.motion.roundtrip.schema import read_json
          root=Path(os.environ['ROOT']); out=root/'source-reference'; animation=read_json(root/'animation'/'animation.json')
          frames=[out/'.frames'/f"frame_{int(row['frame']):04d}.png" for row in animation['frames']]
          compose_sheet(frames,out/'pose_sheet.png',8,(320,320))
          timing=compose_gif(frames,out/'preview.gif',float(animation['fps']))
          (out/'gif_timing.json').write_text(json.dumps(timing,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          shutil.rmtree(out/'.frames')
          PY
      - name: Delete all FBX inputs before canonical model render
        run: |
          set -euo pipefail
          rm -f "$ASSET" "$NORMALIZED"
          test ! -e "$ASSET"
          test ! -e "$NORMALIZED"
      - name: Render actual mesh using only Model + Rig + Skin + Contract B + Camera
        run: |
          set -euo pipefail
          motion2sheet render-model-animation \
            --model "$ROOT/character/model.glb" \
            --character-rig "$ROOT/character/rig.json" \
            --skin "$ROOT/character/skin.json" \
            --animation-rig "$ROOT/animation/rig.json" \
            --animation "$ROOT/animation/animation.json" \
            --camera-profile "$CAMERA" \
            --sheet-columns 8 \
            --canvas 320x320 \
            --background transparent \
            --gif \
            --output "$ROOT/render"
          test ! -e "$ASSET"
          test ! -e "$NORMALIZED"
          test -s "$ROOT/render/pose_sheet.png"
          test -s "$ROOT/render/preview.gif"
          test -s "$ROOT/render/render.json"
          test -s "$ROOT/render/source.blend"
          test -s "$ROOT/render/diagnostics/model_identity.json"
          test -s "$ROOT/render/diagnostics/skin_reconstruction.json"
          test -s "$ROOT/render/diagnostics/playback.json"
      - name: Verify skin, Level-1, animation and GIF gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ['ROOT'])
          export=json.loads((root/'character'/'diagnostics'/'export.json').read_text())
          render=json.loads((root/'render'/'render.json').read_text())
          source=json.loads((root/'source-reference'/'source_reference.json').read_text())
          normalization=json.loads((root/'diagnostics'/'motion_source_normalization.json').read_text())
          assert export['sourceSha256']==os.environ['ASSET_SHA256']
          assert normalization['source']['sha256']==os.environ['ASSET_SHA256']
          assert normalization['fidelity']['pass'] and normalization['lockedPr11RigCapturePass']
          assert normalization['retargeting'] is False and normalization['fuzzyMapping'] is False
          assert source['frameOffset']==normalization['frameOffset']
          assert source['contractFrames']==render['renderedFrames']
          assert source['sourceFrames']==[frame-int(normalization['frameOffset']) for frame in source['contractFrames']]
          stats=render['skinStatistics']
          assert stats['meshCount']>0 and stats['vertexCount']>0 and stats['weightedVertexCount']>0 and stats['influenceCount']>0 and stats['boneCount']>0
          assert stats['unknownBoneReferences']==0
          model=render['modelIdentity']
          assert model['pass'] and model['sameMeshObjects'] and model['sameVertexCounts'] and model['sameVertexOrder']
          skin=render['skinReconstruction']
          assert skin['pass'] and skin['sameMeshObjects'] and skin['sameVertexCounts'] and skin['sameVertexOrder'] and skin['sameInfluencedBones']
          assert skin['maxWeightDelta'] <= 1e-8, skin
          level1=render['rigCompatibility']
          assert level1['pass'] and level1['level']==1 and level1['exactBoneNames'] and level1['exactHierarchy'] and level1['coordinateConventionMatch']
          assert level1['maxRestBasisErrorDegrees'] <= level1['restBasisToleranceDegrees']
          assert level1['retargeting'] is False and level1['fuzzyMapping'] is False
          playback=render['animationFidelity']
          assert playback['pass'] and playback['leftRightIdentityPass'] and playback['fullBonePlayback']
          assert playback['maxSemanticDirectionErrorDegrees'] <= 0.001
          assert playback['maxJointBendErrorDegrees'] <= 0.001
          assert playback['maxLocalRotationErrorDegrees'] <= 0.0001
          assert playback['rootMotion']['directionPreserved']
          assert source['actualSkinnedMesh'] and source['meshCount']>0 and source['vertexCount']>0
          timing=render['gifTiming']; ideal=render['frameCount']/float(render['animation']['fps'])*1000.0
          assert len(timing['frameDurationsMs'])==render['frameCount']
          assert abs(timing['totalDurationMs']-ideal) <= 5.0
          with Image.open(root/'render'/'preview.gif') as im: assert im.n_frames==render['frameCount']
          with Image.open(root/'render'/'pose_sheet.png') as im:
              alpha=im.convert('RGBA').getchannel('A').getextrema(); assert alpha[0]==0 and alpha[1]>0
          summary={
              'releaseAssetSha256': os.environ['ASSET_SHA256'],
              'sourceMeshCount': export['sourceSkinStatistics']['meshCount'],
              'characterBoneCount': export['characterBoneCount'],
              'vertexCount': stats['vertexCount'],
              'weightedVertexCount': stats['weightedVertexCount'],
              'influenceCount': stats['influenceCount'],
              'modelGlbBytes': export['outputs']['modelGlbBytes'],
              'skinJsonBytes': export['outputs']['skinJsonBytes'],
              'deterministicExtraction': True,
              'motionSourceNormalization': normalization['fidelity'],
              'sourceReferenceFrameOffset': source['frameOffset'],
              'maxWeightDelta': skin['maxWeightDelta'],
              'maxRestBasisErrorDegrees': level1['maxRestBasisErrorDegrees'],
              'worstRestBasisBone': level1['worstRestBasisBone'],
              'maxSemanticDirectionErrorDegrees': playback['maxSemanticDirectionErrorDegrees'],
              'maxJointBendErrorDegrees': playback['maxJointBendErrorDegrees'],
              'rootDirectionErrorDegrees': playback['rootMotion']['directionErrorDegrees'],
              'gifTotalDurationMs': timing['totalDurationMs'],
              'gifEffectiveFps': timing['effectiveFps'],
          }
          (root/'e2e-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - name: Build actual-source vs JSON-reconstructed visual comparison
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path(os.environ['ROOT'])
          source=Image.open(root/'source-reference'/'pose_sheet.png').convert('RGBA')
          target=Image.open(root/'render'/'pose_sheet.png').convert('RGBA')
          if source.size != target.size: source=source.resize(target.size)
          w,h=target.size
          out=Image.new('RGBA',(w*2,h+48),(255,255,255,255)); out.alpha_composite(source,(0,48)); out.alpha_composite(target,(w,48))
          draw=ImageDraw.Draw(out); draw.text((12,14),'Original Mixamo With-Skin FBX',fill=(0,0,0,255)); draw.text((w+12,14),'GLB + rig.json + skin.json + animation.json',fill=(0,0,0,255))
          out.save(root/'visual-comparison.png'); out.close(); source.close(); target.close()
          source_gif=Image.open(root/'source-reference'/'preview.gif'); target_gif=Image.open(root/'render'/'preview.gif')
          report=json.loads((root/'render'/'render.json').read_text()); durations=report['gifTiming']['frameDurationsMs']; frames=[]
          assert source_gif.n_frames==target_gif.n_frames==len(durations)
          for index in range(len(durations)):
              source_gif.seek(index); target_gif.seek(index); left=source_gif.convert('RGBA'); right=target_gif.convert('RGBA')
              if left.size != right.size: left=left.resize(right.size)
              fw,fh=right.size; frame=Image.new('RGBA',(fw*2,fh+36),(255,255,255,255)); frame.alpha_composite(left,(0,36)); frame.alpha_composite(right,(fw,36))
              d=ImageDraw.Draw(frame); d.text((8,10),'Original skinned source',fill=(0,0,0,255)); d.text((fw+8,10),'JSON reconstructed skin',fill=(0,0,0,255)); frames.append(frame); left.close(); right.close()
          frames[0].save(root/'visual-comparison.gif',save_all=True,append_images=frames[1:],duration=durations,loop=0,disposal=2,optimize=False)
          for frame in frames: frame.close()
          source_gif.close(); target_gif.close()
          PY
      - name: Upload real skin proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mixamo-skin-contract-b-e2e
          path: build/real_skin_e2e/
          if-no-files-found: warn
          retention-days: 7
