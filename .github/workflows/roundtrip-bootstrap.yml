name: Apply Motion JSON round-trip POC payload

on:
  push:
    branches:
      - feature/motion-json-roundtrip-poc
    paths:
      - '.roundtrip-bootstrap/**'
      - '.github/workflows/roundtrip-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply prepared round-trip implementation
        run: |
          set -euo pipefail
          cat .roundtrip-bootstrap/payload.* | base64 -d > /tmp/roundtrip-poc.tar.gz
          tar -xzf /tmp/roundtrip-poc.tar.gz -C .
          rm -rf .roundtrip-bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement source animation JSON round-trip POC"
          git push origin HEAD:feature/motion-json-roundtrip-poc
