name: Contract C Reusable Humanoid E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reusable-humanoid:
    name: contract-c-e2e / in-place-three-independent-targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ROOT: build/contract_c_poc
      FIXTURES: tests/motion/contract_c/fixtures/release_assets.json
      MAPPING: profiles/contract_c/mixamo_humanoid_v1.json
      CAMERA: profiles/cameras/front_contract_c_inplace.json5
      CANVAS: 224x224
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Contract C unit tests
        run: pytest tests/motion/contract_c
      - name: Assert authority and oracle dependency boundaries
        run: |
          set -euo pipefail
          ! grep -R "worldPositions\|bindMatrix\|sourceBoneNames" motion2sheet/motion/contract_c/schema.py
          ! grep -R "motion2sheet\.anim2sheet\|anim2sheet build\|Contract A" motion2sheet/motion/contract_c
          ! grep -E "blender_export|blender_render|blender_math|build_json_scene" motion2sheet/motion/contract_c/fidelity.py
      - name: Install Blender headless runtime libraries
        run: |
          set -euo pipefail
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with: {version: '4.5.12'}
      - name: Verify Blender
        run: blender --version
      - name: Download and verify exact pinned fixtures
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/diagnostics"
          cp "$FIXTURES" "$ROOT/diagnostics/release_assets.json"
          download_fixture() {
            local key="$1"
            local destination="$2"
            local url sha size
            url="$(jq -r --arg key "$key" '.assets[$key].url' "$FIXTURES")"
            sha="$(jq -r --arg key "$key" '.assets[$key].sha256' "$FIXTURES")"
            size="$(jq -r --arg key "$key" '.assets[$key].size' "$FIXTURES")"
            case "$url" in
              "https://github.com/TrdHuy/motion2sheet/releases/download/e2e_gh_action_asset/"*) ;;
              *) echo "mutable or unexpected fixture URL: $url" >&2; return 1 ;;
            esac
            curl -fL --retry 3 --retry-delay 2 -o "$destination" "$url"
            echo "$sha  $destination" | sha256sum -c -
            test "$(stat -c %s "$destination")" -eq "$size"
          }
          CHARACTER_A_FBX="$RUNNER_TEMP/walking_mixamo_with_skin.fbx"
          MARIA_FBX="$RUNNER_TEMP/Maria.WProp.J.J.Ong.fbx"
          WARROK_FBX="$RUNNER_TEMP/Warrok.W.Kurniawan.fbx"
          IDLE_FBX="$RUNNER_TEMP/idle-without-skin.fbx"
          RUN_FBX="$RUNNER_TEMP/run-without-skin-not-inplace.fbx"
          RUN_INPLACE_FBX="$RUNNER_TEMP/run-without-skin-inplace.fbx"
          download_fixture character-a "$CHARACTER_A_FBX"
          download_fixture maria "$MARIA_FBX"
          download_fixture warrok "$WARROK_FBX"
          download_fixture idle "$IDLE_FBX"
          download_fixture run "$RUN_FBX"
          download_fixture run-inplace "$RUN_INPLACE_FBX"
          {
            echo "CHARACTER_A_FBX=$CHARACTER_A_FBX"
            echo "MARIA_FBX=$MARIA_FBX"
            echo "WARROK_FBX=$WARROK_FBX"
            echo "IDLE_FBX=$IDLE_FBX"
            echo "RUN_FBX=$RUN_FBX"
            echo "RUN_INPLACE_FBX=$RUN_INPLACE_FBX"
          } >> "$GITHUB_ENV"
      - name: Export three independent real-skinned target authorities
        run: |
          set -euo pipefail
          motion2sheet export-character "$CHARACTER_A_FBX" --output "$ROOT/characters/character-a"
          motion2sheet export-character "$MARIA_FBX" --output "$ROOT/characters/maria"
          motion2sheet export-character "$WARROK_FBX" --output "$ROOT/characters/warrok"
          for character in character-a maria warrok; do
            test -s "$ROOT/characters/$character/model.glb"
            test -s "$ROOT/characters/$character/rig.json"
            test -s "$ROOT/characters/$character/skin.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          from motion2sheet.motion.contract_c.mapping import mapping_diagnostics, validate_character_mapping
          from motion2sheet.motion.roundtrip.schema import validate_rig_document
          root=Path(os.environ['ROOT'])
          mapping=json.loads(Path(os.environ['MAPPING']).read_text())
          ids=[]
          for character in ('character-a','maria','warrok'):
              rig=validate_rig_document(json.loads((root/'characters'/character/'rig.json').read_text()))
              validate_character_mapping(mapping,rig)
              diagnostics=mapping_diagnostics(mapping,rig)
              assert diagnostics['leftRightVerification']['pass'] is True
              ids.append(rig['id'])
          assert len(set(ids))==3, ids
          PY
      - name: Normalize motion encoding without retargeting
        run: |
          set -euo pipefail
          IDLE_NORMALIZED="$RUNNER_TEMP/idle-normalized.fbx"
          RUN_NORMALIZED="$RUNNER_TEMP/run-normalized.fbx"
          RUN_INPLACE_NORMALIZED="$RUNNER_TEMP/run-inplace-normalized.fbx"
          blender --background --factory-startup --python-exit-code 1 --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- --input "$IDLE_FBX" --output "$IDLE_NORMALIZED" --report "$ROOT/diagnostics/idle-normalization.json"
          blender --background --factory-startup --python-exit-code 1 --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- --input "$RUN_FBX" --output "$RUN_NORMALIZED" --report "$ROOT/diagnostics/run-normalization.json"
          blender --background --factory-startup --python-exit-code 1 --python motion2sheet/motion/model_render/blender_prepare_motion_source.py -- --input "$RUN_INPLACE_FBX" --output "$RUN_INPLACE_NORMALIZED" --report "$ROOT/diagnostics/run-inplace-normalization.json"
          for path in "$IDLE_NORMALIZED" "$RUN_NORMALIZED" "$RUN_INPLACE_NORMALIZED"; do test -s "$path"; done
          {
            echo "IDLE_NORMALIZED=$IDLE_NORMALIZED"
            echo "RUN_NORMALIZED=$RUN_NORMALIZED"
            echo "RUN_INPLACE_NORMALIZED=$RUN_INPLACE_NORMALIZED"
          } >> "$GITHUB_ENV"
      - name: Export Contract B adapter inputs
        run: |
          set -euo pipefail
          motion2sheet export-animation-json "$IDLE_NORMALIZED" --output "$ROOT/contract_b/idle"
          motion2sheet export-animation-json "$RUN_NORMALIZED" --output "$ROOT/contract_b/run"
          motion2sheet export-animation-json "$RUN_INPLACE_NORMALIZED" --output "$ROOT/contract_b/run-inplace"
          for clip in idle run run-inplace; do
            test -s "$ROOT/contract_b/$clip/rig.json"
            test -s "$ROOT/contract_b/$clip/animation.json"
          done
      - name: Export one in-place Contract C authority per clip
        run: |
          set -euo pipefail
          for clip in idle run run-inplace; do
            motion2sheet export-contract-c-animation \
              --source-rig "$ROOT/contract_b/$clip/rig.json" \
              --source-animation "$ROOT/contract_b/$clip/animation.json" \
              --mapping "$MAPPING" --id "$clip" --loop \
              --output "$ROOT/animations/$clip"
          done
          sha256sum "$ROOT"/animations/*/animation.json | tee "$ROOT/diagnostics/contract-c-authority-sha256.txt"
      - name: Gate independent Source to Contract C fidelity
        run: |
          set -euo pipefail
          for clip in idle run run-inplace; do
            motion2sheet verify-contract-c-fidelity \
              --source-rig "$ROOT/contract_b/$clip/rig.json" \
              --source-animation "$ROOT/contract_b/$clip/animation.json" \
              --source-mapping "$MAPPING" \
              --animation "$ROOT/animations/$clip/animation.json" \
              --output "$ROOT/animations/$clip/diagnostics/source_contract_c_fidelity.json"
          done
      - name: Verify deterministic Contract C serialization
        run: |
          set -euo pipefail
          for clip in idle run run-inplace; do
            deterministic="$RUNNER_TEMP/contract-c-determinism-$clip"
            motion2sheet export-contract-c-animation \
              --source-rig "$ROOT/contract_b/$clip/rig.json" \
              --source-animation "$ROOT/contract_b/$clip/animation.json" \
              --mapping "$MAPPING" --id "$clip" --loop --output "$deterministic"
            cmp "$ROOT/animations/$clip/animation.json" "$deterministic/animation.json"
            rm -rf "$deterministic"
          done
      - name: Delete source and adapter authorities before playback
        run: |
          set -euo pipefail
          rm -f "$CHARACTER_A_FBX" "$MARIA_FBX" "$WARROK_FBX" "$IDLE_FBX" "$RUN_FBX" "$RUN_INPLACE_FBX" "$IDLE_NORMALIZED" "$RUN_NORMALIZED" "$RUN_INPLACE_NORMALIZED"
          rm -rf "$ROOT/contract_b"
          for path in "$CHARACTER_A_FBX" "$MARIA_FBX" "$WARROK_FBX" "$IDLE_FBX" "$RUN_FBX" "$RUN_INPLACE_FBX" "$IDLE_NORMALIZED" "$RUN_NORMALIZED" "$RUN_INPLACE_NORMALIZED" "$ROOT/contract_b"; do
            test ! -e "$path"
          done
      - name: Render the exact authorities on all independent targets
        run: |
          set -euo pipefail
          for character in character-a maria warrok; do
            for clip in idle run run-inplace; do
              motion2sheet render-contract-c-animation \
                --model "$ROOT/characters/$character/model.glb" \
                --character-rig "$ROOT/characters/$character/rig.json" \
                --skin "$ROOT/characters/$character/skin.json" \
                --character-mapping "$MAPPING" \
                --animation "$ROOT/animations/$clip/animation.json" \
                --camera-profile "$CAMERA" --frames all --canvas "$CANVAS" \
                --sheet-columns 10 --render-samples 8 --gif \
                --output "$ROOT/renders/$character/$clip"
            done
          done
      - name: Verify independent portability and immutable authority acceptance
        run: |
          set -euo pipefail
          python tests/motion/contract_c/verify_local_acceptance.py --root "$ROOT" --output "$ROOT/acceptance.json"
          test ! -e "$ROOT/contract_b"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['ROOT'])/'acceptance.json').read_text())
          assert report['pass'] is True and not report['failures']
          assert report['independentCharacters']==['character-a','maria','warrok']
          assert report['proof']['run']['fidelity']['locomotionStripping']['sourceHadPlanarLocomotion'] is True
          assert report['proof']['run']['fidelity']['rootInvariant']['pass'] is True
          PY
      - name: Upload Contract C independent humanoid proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-c-inplace-independent-humanoid-e2e
          path: build/contract_c_poc/
          if-no-files-found: warn
          retention-days: 7
