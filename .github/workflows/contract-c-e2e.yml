name: Contract C Reusable Humanoid E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reusable-humanoid:
    name: contract-c-e2e / in-place-three-independent-targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run Contract C unit tests
        run: pytest tests/motion/contract_c
      - name: Install Blender headless runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb
      - name: Setup Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: "4.5.12"
      - name: Verify Blender
        run: blender --version
      - name: Run reusable Contract C E2E proof
        run: bash tests/motion/contract_c/run_e2e.sh build/motion/contract-c
      - name: Upload Contract C independent humanoid proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-c-inplace-independent-humanoid-e2e
          path: build/motion/contract-c/
          if-no-files-found: warn
          retention-days: 7
