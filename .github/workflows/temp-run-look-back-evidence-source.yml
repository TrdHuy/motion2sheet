name: temp-run-look-back-evidence-source

on:
  push:
    branches:
      - metadata-evidence/run-look-back

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact evidence branch
        uses: actions/checkout@v4
      - name: Package trusted source files
        uses: actions/upload-artifact@v4
        with:
          name: run-look-back-source
          if-no-files-found: error
          path: |
            sample/humanoid_motion/mixamo/run-look-back/animation.json
            sample/humanoid_motion/mixamo/run-look-back/preview.gif
