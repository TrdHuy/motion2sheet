[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motion2sheet"
version = "0.1.0"
description = "Convert FBX/BVH humanoid motion into canonical 2D pose sprite sheets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
motion2sheet = "motion2sheet.cli:main"
vfx2sheet = "motion2sheet.vfx.cli:main"

[tool.setuptools.packages.find]
include = ["motion2sheet*"]

[tool.setuptools.package-data]
motion2sheet = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
